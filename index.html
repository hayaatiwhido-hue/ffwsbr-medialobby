<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>403 Forbidden</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="forbidden-container">

        <h1>403</h1>

        <h2>Forbidden</h2>

        <div class="divider"></div>

        <p>
            Acesso negado.
            <br>
            Este site encontra-se temporariamente desativado.
        </p>

        <section class="server-box">
            <span>Server Response:</span><br><br>
            HTTP/1.1 403 Forbidden<br>
            Error: Website Disabled<br>
            Permission denied
        </section>

        <div class="status">
            ● SITE OFFLINE
        </div>

        <footer>
            Powered by Server Security
        </footer>

    </main>

</body>
</html>
