<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Acesso - Media Lobby FFWS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face { font-family: 'GFF-Latin'; src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'); }
        body { font-family: 'GFF-Latin', sans-serif; background-image: url('info-ffws/backgroundpainel.png'); background-position: center; background-size: cover; }
        .btn-primary { background-color: #e8b033; color: #1a1a1a; }
        .btn-primary:hover { background-color: #f74afe; color: #fff; }
        
        .loader {
            border: 3px solid rgba(232, 176, 51, 0.2);
            border-top: 3px solid #e8b033;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .dominio-item { transition: background-color .15s ease, border-color .15s ease; }
        .dominio-item:hover { background-color: #252538; }
        .dominio-item.selecionado { background-color: rgba(232, 176, 51, 0.12); border-left-color: #e8b033; }
        #lista-dominios::-webkit-scrollbar { width: 7px; }
        #lista-dominios::-webkit-scrollbar-track { background: #10101e; }
        #lista-dominios::-webkit-scrollbar-thumb { background: #555; border-radius: 8px; }
        #lista-dominios::-webkit-scrollbar-thumb:hover { background: #e8b033; }


    </style>
</head>
<body class="flex min-h-screen items-center justify-center">

    <div class="bg-[#10101e]/90 p-8 rounded-xl shadow-2xl w-96 border border-[#e8b033]/50 backdrop-blur-sm">
        <div class="flex justify-center items-center gap-3 mb-4">
            <img src="info-ffws/logoffws.png" class="max-h-20" alt="Logo FFWS">
            <img id="logo-diretoria" src="" class="max-h-16 max-w-32 object-contain" alt="Logo Diretoria" onerror="this.style.display='none'">
        </div>
        <h1 class="text-xl font-bold mb-6 text-center text-[#e8b033]">PAINEL DE ACESSO - MEDIA LOBBY</h1>
        
        <p id="mensagem-status" class="hidden text-sm mb-4 text-center font-bold flex items-center justify-center gap-2"></p>
        
        <form id="login-form">
            <!-- O login começa como um email normal. O filtro abaixo só altera o campo quando um domínio é selecionado. -->
            <label for="email-prefix" class="block text-sm font-semibold text-gray-300 mb-2">ENDEREÇO DE EMAIL</label>
            <div id="campo-email" class="flex w-full mb-3">
                <input type="text" id="email-prefix" placeholder="Email@dominio.com" autocomplete="username" required class="w-full p-3 rounded bg-[#1a1a2e] border border-[#444] text-white focus:outline-none focus:border-[#e8b033]">
                <div id="dominio-selecionado" class="hidden items-center px-3 rounded-r bg-[#252538] border border-[#444] text-[#e8b033] font-semibold text-sm whitespace-nowrap max-w-[48%] overflow-hidden"></div>
            </div>

            <!-- Configuração de domínio fica abaixo do campo de email. -->
            <label class="block text-sm font-semibold text-gray-300 mb-2">ORGANIZAÇÃO / DOMÍNIO <span class="text-gray-500 font-normal">(opcional)</span></label>
            <div id="lista-dominios" class="w-full mb-4 rounded bg-[#1a1a2e] border border-[#444] overflow-y-auto max-h-44 scrollbar-thin">
                <!-- Os domínios são inseridos automaticamente a partir de dominiosLogin no dados.js. -->
            </div>

            <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required class="w-full p-3 rounded bg-[#1a1a2e] border border-[#444] mb-4 text-white focus:outline-none focus:border-[#e8b033]">
            <button type="submit" id="btn-entrar" class="w-full btn-primary p-3 rounded font-bold transition shadow-md">ACESSAR PAINEL</button>
        </form>

        <!-- Rodapé estilizado dentro do card -->
        <div class="mt-8 pt-6 border-t border-[#e8b033]/20 flex items-center justify-center gap-8">
            <img src="info-ffws/logo-diretoria.png" alt="Diretoria" class="h-16 w-16 object-contain opacity-100" onerror="this.style.display='none'">
            <img src="info-ffws/logo-futury.png" alt="Futury" class="h-16 w-16 object-contain opacity-100" onerror="this.style.display='none'">
        </div>
    </div>

    <script src="dados.js"></script>
    <script>
        const logoDiretoriaEl = document.getElementById('logo-diretoria');
        if (typeof logoDiretoria !== 'undefined' && logoDiretoriaEl) logoDiretoriaEl.src = logoDiretoria;

        /*
         * Os domínios e os nomes exibidos são configurados diretamente
         * no dados.js, na constante "dominiosLogin".
         */
        const listaDominiosEl = document.getElementById('lista-dominios');
        const dominioSelecionadoEl = document.getElementById('dominio-selecionado');
        const emailPrefixEl = document.getElementById('email-prefix');
        const campoEmailEl = document.getElementById('campo-email');

        let dominioAtual = '';

        function carregarDominios() {
            listaDominiosEl.innerHTML = '';

            const configurados = Array.isArray(dominiosLogin) ? dominiosLogin : [];

            // Evita duplicação mesmo se o mesmo domínio for cadastrado duas vezes.
            const vistos = new Set();

            configurados.forEach(item => {
                const dominio = String(item.dominio || '').trim().toLowerCase();
                const nome = String(item.nome || dominio).trim();

                if (!dominio || vistos.has(dominio)) return;
                vistos.add(dominio);

                const botao = document.createElement('button');
                botao.type = 'button';
                botao.className = 'dominio-item w-full text-left px-4 py-3 border-l-2 border-transparent border-b border-[#2d2d42] last:border-b-0 text-white cursor-pointer flex items-center justify-between gap-3';
                botao.dataset.dominio = dominio;

                botao.innerHTML = `
                    <span class="font-semibold">${escaparHtml(nome)}</span>
                    <span class="text-xs text-gray-400">${escaparHtml(dominio)}</span>
                `;

                botao.addEventListener('click', () => selecionarDominio(dominio, botao));
                listaDominiosEl.appendChild(botao);
            });

            if (!listaDominiosEl.children.length) {
                listaDominiosEl.innerHTML = `
                    <div class="px-4 py-3 text-sm text-gray-500">
                        Nenhum domínio configurado no dados.js.
                    </div>
                `;
            }
        }

        function escaparHtml(texto) {
            return String(texto ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function selecionarDominio(dominio, elemento) {
            // Guarda o que o usuário já digitou antes de mudar para o modo prefixo.
            const valorAtual = emailPrefixEl.value.trim();
            const eraEmailCompleto = valorAtual.includes('@');
            const prefixo = eraEmailCompleto ? valorAtual.split('@')[0] : valorAtual;

            dominioAtual = dominio;

            document.querySelectorAll('.dominio-item').forEach(item => {
                item.classList.remove('selecionado');
            });

            if (elemento) elemento.classList.add('selecionado');

            // Somente agora o campo passa a aceitar apenas a parte antes do @.
            emailPrefixEl.value = prefixo;
            emailPrefixEl.placeholder = 'Digite somente seu login';
            emailPrefixEl.type = 'text';
            emailPrefixEl.classList.remove('rounded');
            emailPrefixEl.classList.add('rounded-l', 'border-r-0');

            dominioSelecionadoEl.textContent = dominio;
            dominioSelecionadoEl.classList.remove('hidden');
            dominioSelecionadoEl.classList.add('flex');
        }

        carregarDominios();
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const valorLogin = emailPrefixEl.value.trim().toLowerCase();
            const passInput = document.getElementById('senha').value;
            const emailInput = dominioAtual
                ? `${valorLogin}${dominioAtual}`
                : valorLogin;
            const msgStatus = document.getElementById('mensagem-status');
            const btnEntrar = document.getElementById('btn-entrar');

            if (!valorLogin) {
                msgStatus.className = "text-red-400 text-sm mb-4 text-center font-bold";
                msgStatus.innerText = "Informe seu endereço de email.";
                msgStatus.classList.remove('hidden');
                return;
            }

            // Sem selecionar domínio, o usuário pode entrar normalmente com email completo.
            // Com domínio selecionado, somente a parte antes do @ é usada.
            if (!dominioAtual && !valorLogin.includes('@')) {
                msgStatus.className = "text-red-400 text-sm mb-4 text-center font-bold";
                msgStatus.innerText = "Digite o email completo ou selecione um domínio abaixo.";
                msgStatus.classList.remove('hidden');
                return;
            }

            btnEntrar.disabled = true;
            msgStatus.className = "text-yellow-400 text-sm mb-4 text-center font-bold flex items-center justify-center gap-2";
            msgStatus.innerHTML = `<div class="loader"></div> PROCESSANDO...`;
            msgStatus.classList.remove('hidden');

            setTimeout(() => {
                const user = listaUsuarios.find(u =>
                    String(u.email || '').trim().toLowerCase() === emailInput &&
                    u.senha === passInput
                );

                if (user) {
                    msgStatus.className = "text-green-500 text-sm mb-4 text-center font-bold";
                    msgStatus.innerText = "LOGIN AUTORIZADO";
                    sessionStorage.setItem('autenticado', 'true');
                    sessionStorage.setItem('user_scope', user.scope);
                    sessionStorage.setItem('user_type', user.tipo || (user.scope === 'player' ? 'player' : 'standard'));

                    if (user.scope === 'player') {
                        sessionStorage.setItem('player_id', user.playerId || '');
                    } else {
                        sessionStorage.removeItem('player_id');
                    }

                    setTimeout(() => window.location.href = 'painel.html', 1000);
                } else {
                    msgStatus.className = "text-red-400 text-sm mb-4 text-center font-bold";
                    msgStatus.innerText = "Credenciais de Acesso Incorreta!";
                    btnEntrar.disabled = false;
                }
            }, 1500);
        });
    </script>
</body>
</html>
