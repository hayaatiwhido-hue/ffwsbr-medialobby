<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN - MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Regular.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        body {
            font-family: 'GFF-Latin', sans-serif;
            background-color: #05050b;
            color: #f7f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="p-4">
    <div class="w-full max-w-md p-8 bg-[#11111e]/90 border border-white/10 rounded-3xl shadow-2xl backdrop-blur-xl">
        <div class="text-center mb-6">
            <img src="info-ffws/logoffws.png" alt="Logo FFWS" class="h-14 mx-auto object-contain mb-3">
            <h1 class="text-xl font-black text-white">MEDIA LOBBY</h1>
            <p class="text-xs text-gray-400 mt-1">Insira suas credenciais para acessar o acervo</p>
        </div>
        <form onsubmit="fazerLogin(event)" class="space-y-4">
            <div>
                <label class="block text-[10px] uppercase font-bold text-gray-400 mb-1">Código de Acesso / Token</label>
                <input type="password" id="token-acesso" required class="w-full px-4 py-3 bg-black/40 border border-white/10 rounded-xl text-white text-sm focus:border-amber-400 focus:outline-none transition">
            </div>
            <button type="submit" class="w-full py-3 bg-[#e8b033] hover:bg-[#f74afe] text-black hover:text-white font-black text-xs uppercase tracking-wider rounded-xl transition shadow-lg cursor-pointer">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        function fazerLogin(e) {
            e.preventDefault();
            const token = document.getElementById('token-acesso').value.trim();
            if (token) {
                sessionStorage.setItem('autenticado', 'true');
                sessionStorage.setItem('user_scope', 'all');
                window.location.href = 'painel.html';
            }
        }
    </script>
</body>
</html>
