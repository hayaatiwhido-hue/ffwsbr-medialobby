<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Thin.woff2') format('woff2'), url('fonts/GFF-Latin-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Regular.woff2') format('woff2'), url('fonts/GFF-Latin-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Medium.woff2') format('woff2'), url('fonts/GFF-Latin-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'GFF-Latin', sans-serif;
            font-weight: 400;
            background-image: url('info-ffws/backgroundpainel2type.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        .accent-purple { color: #f74afe; }
        .btn-primary { background-color: #e8b033; color: #1a1a1a; }
        .btn-primary:hover { background-color: #f74afe; color: #fff; }
        .card-hover:hover { border-color: #f74afe; box-shadow: 0 4px 20px rgba(247, 74, 254, 0.2); }

        /* ===== CARDS DA HOME / EQUIPES ===== */
        .team-preview-card{position:relative;width:100%;aspect-ratio:1/1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px 22px 22px;border-radius:24px;background:linear-gradient(145deg,rgba(28,28,48,.90),rgba(9,9,19,.94));border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 45px rgba(0,0,0,.25);cursor:pointer;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}
        .team-preview-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,rgba(232,176,51,.13),transparent 36%),linear-gradient(135deg,transparent 55%,rgba(247,74,254,.05));pointer-events:none}
        .team-preview-card::after{content:'';position:absolute;left:16%;right:16%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,#e8b033,#f74afe,transparent);opacity:.55}
        .team-preview-card:hover{transform:translateY(-6px);border-color:rgba(232,176,51,.38);box-shadow:0 26px 65px rgba(0,0,0,.38),0 0 32px rgba(247,74,254,.07)}
        .team-preview-left{position:relative;z-index:1;width:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .team-preview-logo{width:112px;height:112px;display:flex;align-items:center;justify-content:center;padding:13px;border-radius:22px;background:rgba(5,5,13,.50);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 0 30px rgba(255,255,255,.025),0 10px 35px rgba(0,0,0,.22)}
        .team-preview-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.38))}
        .team-preview-name{margin-top:16px;line-height:1.05;max-width:100%;color:#fff;font-size:17px;font-weight:900;letter-spacing:.04em}
        .team-preview-caption{margin-top:8px;color:#74748a;font-size:8px;letter-spacing:.18em;font-weight:800}
        .team-player-list{display:none!important}
        .team-preview-action{position:relative;z-index:1;margin-top:18px;color:#e8b033;font-size:9px;letter-spacing:.14em;font-weight:900;text-transform:uppercase}
        .team-roster-section{grid-column:1/-1;position:relative;padding:22px;border-radius:24px;background:linear-gradient(145deg,rgba(25,25,43,.72),rgba(9,9,18,.72));border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 46px rgba(0,0,0,.22)}
        .team-roster-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:18px}.team-roster-kicker{color:#e8b033;font-size:8px;letter-spacing:.20em;font-weight:900}.team-roster-heading h2{margin-top:5px;color:#fff;font-size:20px;font-weight:900;letter-spacing:-.02em}.team-roster-heading p{margin-top:4px;color:#727287;font-size:9px;letter-spacing:.08em}.team-roster-count{color:#f74afe;font-size:9px;font-weight:900;letter-spacing:.14em}
        .team-roster-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.team-player-card{position:relative;min-width:0;padding:14px;border-radius:16px;display:flex;align-items:center;gap:12px;background:rgba(9,9,18,.48);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:transform .22s ease,border-color .22s ease,background .22s ease}.team-player-card:hover{transform:translateY(-2px);border-color:rgba(232,176,51,.34);background:rgba(232,176,51,.055)}.team-player-avatar{width:46px;height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:linear-gradient(145deg,rgba(232,176,51,.12),rgba(247,74,254,.08));border:1px solid rgba(232,176,51,.18)}.team-player-avatar img{width:30px;height:30px;object-fit:contain}.team-player-card-label{color:#626276;font-size:7px;letter-spacing:.16em;font-weight:800}.team-player-card-name{margin-top:3px;color:#fff;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team-player-card-role{margin-top:3px;color:#e8b033;font-size:8px;font-weight:800;letter-spacing:.08em}
        @media(max-width:640px){.team-preview-card{aspect-ratio:1/1;padding:22px 16px 18px;border-radius:20px}.team-preview-logo{width:82px;height:82px;padding:10px;border-radius:18px}.team-preview-name{font-size:14px;margin-top:12px}.team-preview-caption{font-size:7px}.team-preview-action{margin-top:13px;font-size:8px}.team-roster-section{padding:16px;border-radius:20px}.team-roster-heading h2{font-size:17px}.team-roster-grid{grid-template-columns:1fr}.team-player-card{padding:12px}}

        /* Pastas de poses dentro da equipe — biblioteca de mídia profissional */
        .pose-folder-card {
            position: relative;
            overflow: hidden;
            min-height: 214px;
            background: linear-gradient(145deg, rgba(24,24,40,.98), rgba(15,15,29,.98));
            border: 1px solid #2a2a3f;
            box-shadow: 0 10px 28px rgba(0,0,0,.18);
        }
        .pose-folder-card::before {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(180deg, #e8b033, #f74afe);
            opacity: .9;
        }
        .pose-folder-card::after {
            content: '';
            position: absolute;
            width: 170px;
            height: 170px;
            right: -90px;
            top: -95px;
            border-radius: 999px;
            background: rgba(247,74,254,.08);
            pointer-events: none;
        }
        .pose-folder-card:hover {
            border-color: rgba(247,74,254,.7);
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(247,74,254,.12);
        }
        .pose-folder-topline {
            letter-spacing: .2em;
            font-size: 9px;
            color: #77778b;
            font-weight: 500;
        }
        .pose-folder-code {
            min-width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232,176,51,.08);
            border: 1px solid rgba(232,176,51,.28);
            color: #e8b033;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
        }
        .pose-folder-direction {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #b5b5c4;
            font-size: 11px;
            font-weight: 500;
        }
        .pose-folder-direction::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: #f74afe;
            box-shadow: 0 0 10px rgba(247,74,254,.65);
        }
        .pose-folder-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            padding-top: 13px;
            border-top: 1px solid #29293b;
        }
        .pose-folder-open {
            color: #f74afe;
            font-size: 12px;
            font-weight: 700;
            transition: transform .2s ease;
        }
        .pose-folder-card:hover .pose-folder-open {
            transform: translateX(3px);
        }
        .pose-folder-meta {
            color: #626276;
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        @media (max-width: 640px) {
            .pose-folder-card {
                min-height: 190px;
            }
            .pose-folder-code {
                min-width: 40px;
                height: 40px;
            }
        }

        .pose-folder-card-modern{min-height:255px;padding:0!important;display:flex;flex-direction:column;cursor:pointer}.pose-folder-card-modern::before{width:100%;height:2px;inset:0 0 auto 0;opacity:.75}.pose-folder-visual{position:relative;min-height:94px;display:flex;align-items:center;justify-content:space-between;padding:18px;background:linear-gradient(135deg,rgba(232,176,51,.08),rgba(247,74,254,.04));border-bottom:1px solid rgba(255,255,255,.07);overflow:hidden}.pose-folder-visual::after{content:'';position:absolute;width:150px;height:150px;right:-65px;top:-85px;border-radius:50%;border:1px solid rgba(247,74,254,.13);box-shadow:0 0 0 18px rgba(247,74,254,.025),0 0 0 36px rgba(247,74,254,.015)}.pose-folder-visual .pose-folder-code{position:relative;z-index:2;width:58px;height:58px;border-radius:16px;background:rgba(5,5,13,.58);border:1px solid rgba(232,176,51,.30);color:#ffd66b;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.20)}.pose-folder-lines{position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;width:45%;opacity:.5}.pose-folder-lines span{height:4px;border-radius:99px;background:linear-gradient(90deg,rgba(232,176,51,.7),rgba(247,74,254,.05))}.pose-folder-lines span:nth-child(2){width:72%}.pose-folder-lines span:nth-child(3){width:50%}.pose-folder-body{flex:1;padding:18px 18px 4px}.pose-folder-body h2{margin-top:7px;color:#fff;font-size:17px;line-height:1.1;font-weight:900}.pose-folder-body p{margin-top:8px;color:#85859a;font-size:9px;line-height:1.55}.pose-folder-card-modern .pose-folder-direction{margin-top:8px;font-size:8px}.pose-folder-card-modern .pose-folder-action{margin:12px 18px 16px;padding-top:12px}@media(max-width:640px){.pose-folder-card-modern{min-height:230px}.pose-folder-visual{min-height:78px;padding:13px 14px}.pose-folder-visual .pose-folder-code{width:48px;height:48px}.pose-folder-body{padding:15px 14px 4px}.pose-folder-body h2{font-size:14px}.pose-folder-body p{font-size:8px}.pose-folder-card-modern .pose-folder-action{margin:10px 14px 13px}}

        /* Biblioteca visual de logotipos e brasões */
        .media-library-card {
            position: relative;
            min-height: 218px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px;
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(27,27,44,.98), rgba(14,14,27,.98));
            border: 1px solid rgba(232,176,51,.35);
            box-shadow: 0 16px 38px rgba(0,0,0,.22);
            cursor: pointer;
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }
        .media-library-card:hover { transform: translateY(-4px); border-color: rgba(247,74,254,.72); box-shadow: 0 20px 45px rgba(247,74,254,.13); }
        .media-library-glow { position:absolute; width:190px; height:190px; right:-85px; top:-95px; border-radius:50%; background:rgba(247,74,254,.08); pointer-events:none; }
        .media-library-icon { width:54px; height:54px; border-radius:15px; display:flex; align-items:center; justify-content:center; background:rgba(232,176,51,.08); border:1px solid rgba(232,176,51,.28); box-shadow:inset 0 0 22px rgba(232,176,51,.04); }
        .media-library-icon svg { width:29px; height:29px; fill:none; stroke:#e8b033; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
        .media-library-content { margin-top:16px; position:relative; z-index:1; }
        .media-library-kicker { color:#77778b; font-size:9px; letter-spacing:.18em; font-weight:700; }
        .media-library-content h2 { color:#f1b72f; font-size:20px; line-height:1.1; margin-top:6px; font-weight:900; }
        .media-library-content p { color:#8f8fa1; font-size:11px; line-height:1.5; margin-top:7px; max-width:430px; }
        .media-library-footer { display:flex; justify-content:space-between; align-items:center; gap:10px; padding-top:13px; margin-top:15px; border-top:1px solid #29293b; position:relative; z-index:1; }
        .media-library-footer span { color:#5f5f73; font-size:8px; letter-spacing:.16em; }
        .media-library-footer strong { color:#f74afe; font-size:11px; }
        .media-library-footer b { margin-left:5px; }

        /* Cards profissionais de prévia das fotos */
        .photo-preview-card, .asset-preview-card {
            position:relative; overflow:hidden; display:flex; flex-direction:column;
            border-radius:18px; background:linear-gradient(145deg, rgba(25,25,42,.99), rgba(14,14,27,.99));
            border:1px solid #2d2d42; box-shadow:0 14px 34px rgba(0,0,0,.2);
            transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }
        .photo-preview-card:hover, .asset-preview-card:hover { transform:translateY(-3px); border-color:rgba(247,74,254,.62); box-shadow:0 18px 42px rgba(247,74,254,.1); }
        .photo-preview-stage { margin:10px 10px 0; border-radius:13px; background:radial-gradient(circle at 50% 15%, rgba(55,55,76,.35), rgba(6,6,15,.96) 68%); border:1px solid #303044; overflow:hidden; }
        .photo-preview-stage-top { height:30px; padding:0 12px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #29293b; color:#68687c; font-size:8px; letter-spacing:.14em; font-weight:700; }
        .photo-preview-stage-top span:last-child { color:#e8b033; }
        .photo-preview-image-wrap { height:270px; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:8px; }
        .photo-preview-image { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 12px 20px rgba(0,0,0,.35)); }
        .photo-preview-info { padding:15px; }
        .photo-identity-row { display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
        .photo-player-label { color:#65657a; font-size:8px; letter-spacing:.16em; font-weight:700; }
        .photo-player-identity h2 { color:#fff; font-size:16px; line-height:1.15; font-weight:900; margin-top:4px; max-width:230px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .photo-player-uid { color:#858597; font-size:10px; white-space:nowrap; }
        .photo-details-row { margin-top:12px; padding-top:11px; border-top:1px solid #29293b; display:flex; flex-direction:column; gap:9px; }
        .photo-role-pill { display:inline-flex; width:max-content; padding:5px 8px; border-radius:7px; background:rgba(232,176,51,.08); border:1px solid rgba(232,176,51,.18); }
        .photo-role-pill span { color:#e8b033 !important; font-size:10px !important; }
        .photo-role-pill img { width:20px !important; height:20px !important; }
        .photo-pose-detail { display:flex; align-items:center; justify-content:space-between; gap:10px; color:#b2b2c0; font-size:10px; }
        .photo-pose-detail b { color:#e8b033; font-size:9px; letter-spacing:.1em; }
        .photo-download-btn, .asset-download-btn { margin-top:13px; width:100%; min-height:43px; border-radius:9px; border:1px solid rgba(232,176,51,.35); background:#e8b033; color:#17171f; display:flex; align-items:center; justify-content:space-between; padding:0 14px; font-size:11px; font-weight:900; cursor:pointer; transition:background .2s ease, color .2s ease, transform .2s ease; }
        .photo-download-btn:hover, .asset-download-btn:hover { background:#f74afe; color:#fff; transform:translateY(-1px); }
        .photo-download-btn b, .asset-download-btn b { font-size:16px; }

        .asset-preview-stage { margin:10px 10px 0; min-height:220px; border-radius:13px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; background:radial-gradient(circle at 50% 45%, rgba(45,45,65,.3), rgba(5,5,13,.96) 72%); border:1px solid #303044; }
        .asset-preview-label { position:absolute; top:10px; left:12px; color:#68687c; font-size:8px; letter-spacing:.14em; font-weight:700; }
        .asset-preview-image-wrap { width:100%; height:205px; padding:22px; display:flex; align-items:center; justify-content:center; }
        .asset-preview-image { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 10px 18px rgba(0,0,0,.4)); }
        .asset-preview-info { padding:14px 15px 15px; }
        .asset-preview-kicker { color:#77778b; font-size:8px; letter-spacing:.15em; font-weight:700; }
        .asset-preview-info h2 { color:#fff; font-size:14px; font-weight:900; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .asset-download-btn { margin-top:12px; }
        @media (max-width:640px) {
            .media-library-card { min-height:205px; padding:18px; }
            .media-library-icon { width:48px; height:48px; }
            .media-library-icon svg { width:25px; height:25px; }
            .photo-preview-image-wrap { height:245px; }
            .photo-preview-info { padding:13px; }
            .photo-player-identity h2 { font-size:15px; max-width:190px; }
            .photo-player-uid { font-size:9px; }
            .asset-preview-stage { min-height:190px; }
            .asset-preview-image-wrap { height:175px; }
        }


        /* Perfil exclusivo do jogador — biblioteca editorial premium */
        .player-profile-hero {
            grid-column: 1 / -1;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(232,176,51,.34);
            border-radius: 20px;
            background:
                radial-gradient(circle at 88% 18%, rgba(247,74,254,.12), transparent 28%),
                radial-gradient(circle at 10% 90%, rgba(232,176,51,.09), transparent 30%),
                linear-gradient(145deg, rgba(29,29,48,.98), rgba(14,14,27,.99));
            box-shadow: 0 18px 45px rgba(0,0,0,.25);
        }
        .player-profile-hero::before {
            content:'';
            position:absolute;
            inset:0;
            background:linear-gradient(90deg, rgba(232,176,51,.08), transparent 32%, transparent 68%, rgba(247,74,254,.06));
            pointer-events:none;
        }
        .player-profile-inner { position:relative; z-index:1; padding:20px; }
        .player-profile-kicker { color:#77778b; font-size:8px; letter-spacing:.2em; font-weight:800; }
        .player-profile-name { margin-top:5px; color:#fff; font-size:26px; line-height:1; font-weight:950; letter-spacing:-.02em; }
        .player-profile-team { margin-top:7px; color:#aaaabb; font-size:11px; }
        .player-profile-badge {
            display:inline-flex; align-items:center; gap:7px; margin-top:13px; padding:6px 9px;
            border:1px solid rgba(247,74,254,.22); border-radius:8px; background:rgba(247,74,254,.07);
            color:#f2b83a; font-size:8px; letter-spacing:.12em; font-weight:900;
        }
        .player-profile-logo {
            width:92px; height:92px; flex:0 0 92px; border-radius:16px; padding:12px;
            background:rgba(9,9,18,.55); border:1px solid rgba(232,176,51,.25);
            object-fit:contain; filter:drop-shadow(0 0 14px rgba(232,176,51,.12));
        }
        .player-profile-role {
            display:flex; align-items:center; gap:9px; min-width:145px; padding:10px 12px;
            border-radius:12px; background:rgba(232,176,51,.07); border:1px solid rgba(232,176,51,.18);
        }
        .player-profile-role img { width:30px; height:30px; object-fit:contain; }
        .player-profile-role small { display:block; color:#6f6f82; font-size:7px; letter-spacing:.12em; font-weight:800; }
        .player-profile-role strong { display:block; margin-top:2px; color:#e8b033; font-size:11px; }
        .player-profile-stat { min-width:145px; padding:10px 12px; border-radius:12px; background:rgba(10,10,20,.38); border:1px solid #2b2b40; }
        .player-profile-stat small { color:#6f6f82; font-size:7px; letter-spacing:.12em; font-weight:800; }
        .player-profile-stat strong { display:block; margin-top:4px; color:#fff; font-size:12px; word-break:break-all; }
        .player-library-heading { grid-column:1 / -1; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:2px; }
        .player-library-heading h3 { color:#fff; font-size:16px; font-weight:900; }
        .player-library-heading p { color:#68687c; font-size:9px; letter-spacing:.12em; text-transform:uppercase; }
        .player-photo-card { min-width:0; }
        .player-photo-number { color:#65657a; font-size:8px; letter-spacing:.15em; font-weight:800; }
        .player-photo-count { color:#e8b033; font-size:9px; font-weight:900; }
        @media (max-width:640px) {
            .player-profile-inner { padding:16px; }
            .player-profile-logo { width:72px; height:72px; flex-basis:72px; padding:9px; }
            .player-profile-name { font-size:21px; }
            .player-profile-role, .player-profile-stat { min-width:0; flex:1 1 130px; }
            .player-library-heading { align-items:flex-start; flex-direction:column; }
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #e8b033;
            border-radius: 50%;
            width: 40px;
            height: 40px;

        // Apenas a apresentação das pastas de poses é tratada aqui.
        // As siglas e os dados originais continuam vindo do dados.js.
        function obterInfoPastaPose(estilo) {
            const sigla = String(estilo.sigla || '').toUpperCase();
            const nome = String(estilo.nomeEstilo || '').toUpperCase();

            const direcoes = {
                FRENTE: 'Frente',
                DIREITA: 'Direita',
                ESQUERDA: 'Esquerda',
                DIREITO: 'Direito',
                ESQUERDO: 'Esquerdo'
            };

            let titulo = formatarTitulo(estilo.nomeEstilo || 'Pasta de fotos');
            let direcao = '';
            let descricao = 'Retratos oficiais preparados para uso em materiais de transmissão, imprensa e conteúdo digital.';

            if (nome.includes('BRAÇO SOLTO')) {
                titulo = 'Fotos com Braços Soltos';
                direcao = nome.includes('FRENTE') ? 'Frente' : nome.includes('DIREITA') ? 'Direita' : 'Esquerda';
                descricao = 'Retratos oficiais com os braços em posição solta, organizados por direção para facilitar a seleção da mídia.';
            } else if (nome.includes('BRAÇO CRUZADO')) {
                titulo = 'Fotos com Braços Cruzados';
                direcao = nome.includes('FRENTE') ? 'Frente' : nome.includes('DIREITA') ? 'Direita' : 'Esquerda';
                descricao = 'Retratos oficiais com os braços cruzados, separados por direção para uso rápido em peças e conteúdos editoriais.';
            } else if (nome.includes('FOTO DE IDENTIFICAÇÃO')) {
                titulo = 'Foto de Identificação';
                descricao = 'Retrato principal de identificação do jogador, ideal para perfis, escalações e materiais oficiais.';

                titulo = 'Pose de Booyah';
                descricao = 'Registro oficial da pose de celebração, preparado para destaques, conteúdos competitivos e materiais de vitória.';

                titulo = 'Pose de MVP';
                descricao = 'Retrato especial de destaque do jogador, indicado para conteúdos de MVP e peças de reconhecimento.';
            } else if (nome.includes('FOTO DIVERTIDA')) {
                titulo = 'Fotos Divertidas';
                const numero = nome.match(/\d+/);
                direcao = numero ? `Variação ${numero[0]}` : '';
                descricao = 'Registro descontraído do jogador para conteúdos sociais, bastidores e materiais especiais.';
            } else if (nome.includes('FOTO GIF')) {
                titulo = 'Fotos para GIF';

                descricao = 'Enquadramento fechado de perfil, ideal para composições editoriais e materiais de apresentação.';

        function escaparHtml(texto) {
            return String(texto ?? '')

        function separarNick(nick) {
            const partes = String(nick || '').trim().split(/\s+/).filter(Boolean);
            const tag = partes[0] || 'PLAYER';
            const nickname = partes.slice(1).join(' ') || tag;

        function processarLinkDrive(idOuUrl) {
            if (!idOuUrl) return '';

            let limpo = idOuUrl.trim();

            if (limpo.includes('drive.google.com') || limpo.includes('id=')) {
                const match = limpo.match(/id=([a-zA-Z0-9_-]+)/);

                if (match && match[1]) {
                    limpo = match[1];
                } else {
                    const match2 = limpo.match(/\/d\/([a-zA-Z0-9_-]+)/);

                    if (match2 && match2[1]) {
                        limpo = match2[1];
                    }
                }
            }

            if (limpo.length > 20 && !limpo.includes('/')) {
                return `https://lh3.googleusercontent.com/d/${limpo}`;
            }

            return limpo;
        }

        function processarLinkDrivePreview(idOuUrl, tamanho = 220) {
            const url = processarLinkDrive(idOuUrl);
            if (!url) return '';
            if (url.startsWith('https://lh3.googleusercontent.com/d/')) {
                return `${url}=w${tamanho}`;
            }
            return url;
        }

            const existente = document.getElementById('download-modal-backdrop');
            if (existente) existente.remove();
            const modal = document.createElement('div');
            modal.id = 'download-modal-backdrop';
            modal.className = 'download-modal-backdrop';
            modal.innerHTML = `
                <div class="download-modal">
                    <h3>Como deseja baixar?</h3>
                    <p>Escolha o padrão de nome dos arquivos antes de iniciar o download.</p>
                    <button class="download-choice" data-mode="nick"><b>Baixar com Nickname</b><span>UID-Tag.Nickname_SIGLA DA POSE.png</span></button>
                    <button class="download-choice" data-mode="id"><b>Baixar com ID</b><span>UID.png</span></button>
                    <button class="download-cancel">Cancelar</button>
                    <div class="download-progress"><i></i></div>
                </div>`;
            document.body.appendChild(modal);
            const close = () => modal.remove();
            modal.querySelector('.download-cancel').onclick = close;
            modal.addEventListener('click', async e => {
                if (e.target === modal) return close();
                const choice = e.target.closest('.download-choice');
                if (!choice) return;
                modal.querySelectorAll('.download-choice').forEach(b => b.disabled = true);
                const progress = modal.querySelector('.download-progress i');

                    modal.querySelector('p').textContent = 'O arquivo foi preparado com o padrão escolhido.';
                    setTimeout(close, 900);
                } catch (err) {
                    console.error(err);
                    modal.querySelector('h3').textContent = 'Não foi possível concluir';
                    modal.querySelector('p').textContent = 'Algumas imagens podem bloquear downloads externos. Tente novamente.';
                    modal.querySelectorAll('.download-choice').forEach(b => b.disabled = false);

        async function baixarArquivo(url, nomeArquivo) {
            try {
                const response = await fetch(url, { mode: 'cors' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = nomeArquivo;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                return true;
            } catch (error) {
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.download = nomeArquivo;
                document.body.appendChild(a);
                a.click();
                a.remove();
                return false;
            }
        }

        async function obterBlob(url) {
            const response = await fetch(url, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.blob();
        }

        function coletarFotosMembro(membro, modo, prefixo = '') {
            const itens = [];
            (listaEstilos || []).forEach(estilo => {
                const fileId = membro?.fotos?.[estilo.sigla];
                if (!fileId || !String(fileId).trim()) return;
                const nome = nomeArquivoJogador(membro, estilo.sigla, modo);
                const pastaPose = String(estilo.sigla || 'POSE').replace(/[\\/:*?"<>|]/g, '-');
                itens.push({
                    url: processarLinkDrive(fileId),
                    nome,
                    caminho: prefixo ? `${prefixo}/${pastaPose}/${nome}` : `${pastaPose}/${nome}`
                });
            });
            return itens;
        }

        function coletarFotosEquipe(equipe, modo, incluirPasta = true) {
            const itens = [];
            (equipe.membros || []).forEach(membro => {
                const fotos = coletarFotosMembro(membro, modo, incluirPasta ? 'FOTOS' : '');
                fotos.forEach(item => itens.push(item));
            });
            return itens;
        }

        function coletarAssetsEquipe(equipe) {
            const itens = [];
            [['Logotipos', equipe.logos || []], ['Brasoes', equipe.brasoes || []]].forEach(([pasta, lista]) => {
                lista.forEach((item, idx) => {
                    const valor = typeof item === 'string' ? item : (item.id || item.link);
                    if (!valor || !String(valor).trim() || String(valor).includes('SEU_ID')) return;
                    const nome = (typeof item === 'object' && item.nome) ? item.nome : `${pasta}_${idx + 1}`;
                    itens.push({ url: processarLinkDrive(valor), nome: nomeArquivoGenerico(nome), caminho: `${pasta}/${nomeArquivoGenerico(nome)}` });
                });
            });
            return itens;
        }

        function coletarMediaEquipe(equipe, modo) {
            return [...coletarFotosEquipe(equipe, modo), ...coletarAssetsEquipe(equipe)];
        }

        function coletarPoseEquipe(equipe, estilo, modo) {
            const itens = [];
            (equipe.membros || []).forEach(membro => {
                const fileId = membro?.fotos?.[estilo.sigla];
                if (!fileId || !String(fileId).trim()) return;
                itens.push({
                    url: processarLinkDrive(fileId),
                    nome: nomeArquivoJogador(membro, estilo.sigla, modo),
                    caminho: nomeArquivoJogador(membro, estilo.sigla, modo)
                });
            });
            return itens;
        }

        async function baixarLoteZip(nomeZip, itens, progress) {
            if (!window.JSZip) throw new Error('Biblioteca ZIP não carregada.');
            if (!itens.length) throw new Error('Nenhum arquivo disponível.');
            const zip = new JSZip();
            let concluidos = 0;
            for (const item of itens) {
                try {
                    const blob = await obterBlob(item.url);
                    zip.file(item.caminho || item.nome, blob);
                } catch (e) {
                    console.warn('Arquivo ignorado:', item.url, e);
                }
                concluidos++;
                if (progress) progress.style.width = `${Math.round((concluidos / itens.length) * 85)}%`;
            }
            const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, meta => {
                if (progress) progress.style.width = `${85 + Math.round(meta.percent * .15)}%`;
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${nomeZip}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        async function executarDownload(contexto, payload, modo, progress) {
            if (contexto === 'individual') {
                const item = payload;
                const blob = await obterBlob(item.url);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = nomeArquivoJogador(item.membro, item.sigla, modo);
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1200);
                if (progress) progress.style.width = '100%';
                return;
            }
            if (contexto === 'asset') {
                const item = payload;
                const blob = await obterBlob(item.url);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.nome;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1200);
                if (progress) progress.style.width = '100%';
                return;
            }
            if (contexto === 'pose') {
                await baixarLoteZip(`${equipeSelecionada.nome}_${estiloSelecionado.sigla}`, coletarPoseEquipe(equipeSelecionada, estiloSelecionado, modo), progress);
                return;
            }
            if (contexto === 'team') {
                const itens = coletarMediaEquipe(payload, modo);
                await baixarLoteZip(payload.nome, itens, progress);
                return;
            }
            if (contexto === 'all') {
                const equipes = payload;
                const itens = [];
                equipes.forEach(eq => coletarMediaEquipe(eq, modo).forEach(item => itens.push({ ...item, caminho: `${eq.nome}/${item.caminho}` })));
                await baixarLoteZip('MEDIA_LOBBY_TODAS_EQUIPES', itens, progress);
                return;
            }
            if (contexto === 'selected') {
                const itens = [];
                payload.forEach(eq => coletarFotosEquipe(eq, modo).forEach(item => itens.push({ ...item, caminho: `${eq.nome}/${item.caminho}` })));
                await baixarLoteZip('MEDIA_LOBBY_EQUIPES_SELECIONADAS', itens, progress);
            }
        }

        function ativarLazyMedia() {
            const imagens = document.querySelectorAll('img.lazy-media[data-src]');
            if (!imagens.length) return;
            const carregar = img => {
                if (img.dataset.loaded) return;
                img.src = img.dataset.src;
                img.dataset.loaded = '1';
                img.removeAttribute('data-src');
            };
            if (!('IntersectionObserver' in window)) return imagens.forEach(carregar);
            const obs = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { carregar(entry.target); obs.unobserve(entry.target); }
                });
            }, { rootMargin: '80px 0px', threshold: 0.01 });
            imagens.forEach(img => obs.observe(img));
        }

                        <div class="team-roster-count">${membrosEquipe.length} ${membrosEquipe.length === 1 ? 'PLAYER' : 'PLAYERS'}</div>
                    </div>
                    <div class="team-roster-grid">${rosterCards}</div>
                </section>
            `;

            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Logotipos')" class="media-library-card media-library-card--brand">
                    <div class="media-library-glow"></div>
                    <div class="media-library-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l1.7 2H20a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V8A1.5 1.5 0 0 1 3.5 6.5Z"/><path d="M3 10h18"/></svg>
                    </div>
                    <div class="media-library-content">
                        <span class="media-library-kicker">IDENTIDADE VISUAL</span>
                        <h2>Logotipos</h2>
                        <p>Arquivos oficiais da marca, em diferentes versões e aplicações.</p>
                    </div>
                    <div class="media-library-footer"><span>BRAND ASSETS</span><strong>Abrir biblioteca <b>↗</b></strong></div>
                </div>
            `;

            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Brasões')" class="media-library-card media-library-card--crest">
                    <div class="media-library-glow"></div>
                    <div class="media-library-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v6.3c0 4.2-2.4 7.1-6 8.7-3.6-1.6-6-4.5-6-8.7V4.5Z"/><path d="M9 9.2h6M12 7v6.2"/></svg>
                    </div>
                    <div class="media-library-content">
                        <span class="media-library-kicker">IDENTIDADE COMPETITIVA</span>
                        <h2>Brasões</h2>
                        <p>Emblemas e variações oficiais utilizados pela equipe.</p>
                    </div>
                    <div class="media-library-footer"><span>CREST ASSETS</span><strong>Abrir biblioteca <b>↗</b></strong></div>
                </div>
            `;

            listaEstilos.forEach((estilo, index) => {
                const info = obterInfoPastaPose(estilo);

                container.innerHTML += `
                    <div onclick="abrirEstilo(${index})" class="pose-folder-card pose-folder-card-modern">
                        <div class="pose-folder-visual"><div class="pose-folder-code">${escaparHtml(info.codigo)}</div><div class="pose-folder-lines"><span></span><span></span><span></span></div></div>
                        <div class="pose-folder-body"><span class="pose-folder-topline">PHOTO COLLECTION</span><h2>${escaparHtml(info.titulo)}</h2>${info.direcao ? `<div class="pose-folder-direction">${escaparHtml(info.direcao)}</div>` : ''}<p>${escaparHtml(info.descricao)}</p></div>
                        <div class="pose-folder-action"><span class="pose-folder-meta">${escaparHtml(info.codigo)} · MEDIA ASSET</span><span class="pose-folder-open">Abrir ↗</span></div>
                    </div>
                `;
            });

            irParaTopo();
        }

        // Acesso de jogador: mantém o mesmo painel, mas usa uma apresentação editorial exclusiva.
        // O restante do site continua com o design já existente.
        function abrirEquipeJogador(equipe, membro) {
            equipeSelecionada = equipe;
            nivelAtual = 'player';

            titulo.innerText = 'PLAYER MEDIA';
            subtitulo.innerText = `${equipe.nome} · Acervo fotográfico exclusivo`;

            logoCabecalho.src = processarLinkDrive(equipe.logo);
            logoCabecalho.classList.remove('hidden');

            if (scope === 'all') {
                configurarNavegacao('all');
            } else if (scope === 'player') {
                configurarNavegacao('player');
            } else {
                configurarNavegacao('team');
            }

            const funcao = String(membro.funcao || '').trim().toUpperCase();
            const icone = iconesFuncoes[funcao] || '';
            const uid = String(membro.uid || '').trim();
            const fotosDisponiveis = listaEstilos.filter(estilo => {
                const fileId = membro.fotos ? membro.fotos[estilo.sigla] : null;
                return fileId && String(fileId).trim() !== '';
            });

            const roleHtml = funcao && icone
                ? `<div class="player-profile-role">
                        <img src="${icone}" alt="${escaparHtml(funcao)}">
                        <div><small>FUNÇÃO COMPETITIVA</small><strong>${escaparHtml(funcao)}</strong></div>
                   </div>`
                : `<div class="player-profile-role"><div><small>FUNÇÃO COMPETITIVA</small><strong>Não cadastrada</strong></div></div>`;

            const uidHtml = `<div class="player-profile-stat"><small>UID DA CONTA</small><strong>${uid ? escaparHtml(uid) : 'Não cadastrado'}</strong></div>`;
            const countHtml = `<div class="player-profile-stat"><small>ACERVO DISPONÍVEL</small><strong>${fotosDisponiveis.length} ${fotosDisponiveis.length === 1 ? 'foto' : 'fotos'}</strong></div>`;

            container.innerHTML = `
                <section class="player-profile-hero">
                    <div class="player-profile-inner">
                        <div class="flex flex-col md:flex-row md:items-center gap-5">
                            <img src="${processarLinkDrive(equipe.logo)}" alt="${escaparHtml(equipe.nome)}" class="player-profile-logo" onerror="this.style.opacity='.25'">
                            <div class="flex-1 min-w-0">
                                <div class="player-profile-kicker">PLAYER MEDIA / ACESSO RESTRITO</div>
                                <div class="player-profile-name truncate">${escaparHtml(membro.nick)}</div>
                                <div class="player-profile-team">${escaparHtml(equipe.nome)} · biblioteca individual de mídia</div>
                                <span class="player-profile-badge">● ACERVO AUTORIZADO</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-2 mt-5">
                            ${roleHtml}
                            ${uidHtml}
                            ${countHtml}
                        </div>
                    </div>
                </section>

                <div class="player-library-heading">
                    <div>
                        <h3>Biblioteca fotográfica</h3>
                        <p>Poses e materiais oficiais disponíveis para este acesso</p>
                    </div>
                    <span class="player-photo-count">${fotosDisponiveis.length} ASSETS</span>
                </div>
            `;

            let htmlCards = '';
            let contadorEncontrados = 0;

            listaEstilos.forEach((estilo, index) => {
                const siglaEstilo = estilo.sigla;
                const fileId = membro.fotos ? membro.fotos[siglaEstilo] : null;
                if (!fileId || String(fileId).trim() === '') return;

                contadorEncontrados++;
                const urlDownloadOriginal = processarLinkDrive(fileId);
                const urlDriveImg = processarLinkDrivePreview(fileId, 720);
                const nomeArquivo = nomeArquivoJogador(membro, siglaEstilo, 'nick');
                const info = obterInfoPastaPose(estilo);

                const funcaoCard = funcao && icone
                    ? `<div class="photo-role-pill"><span class="flex items-center gap-1.5"><img src="${icone}" alt="${escaparHtml(funcao)}"><span>${escaparHtml(funcao)}</span></span></div>`
                    : '';

                htmlCards += `
                    <article class="photo-preview-card player-photo-card">
                        <div class="photo-preview-stage">
                            <div class="photo-preview-stage-top">
                                <span>OFFICIAL PLAYER MEDIA</span>
                                <span>${escaparHtml(siglaEstilo)}</span>
                            </div>
                            <div class="photo-preview-image-wrap">
                                <img data-src="${urlDriveImg}" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="${escaparHtml(membro.nick)} · ${escaparHtml(info.titulo)}" class="photo-preview-image lazy-media" loading="lazy" decoding="async" fetchpriority="low" onerror="this.src='info-ffws/logoffws.png'">
                            </div>
                        </div>
                        <div class="photo-preview-info">
                            <div class="flex items-center justify-between gap-3 mb-2">
                                <span class="player-photo-number">ASSET ${String(contadorEncontrados).padStart(2,'0')}</span>
                                <span class="player-photo-number">${escaparHtml(siglaEstilo)}</span>
                            </div>
                            <div class="photo-identity-row">
                                <div class="photo-player-identity">
                                    <span class="photo-player-label">PLAYER</span>
                                    <h2 title="${escaparHtml(membro.nick)}">${escaparHtml(membro.nick)}</h2>
                                </div>
                            </div>
                            <div class="photo-details-row">
                                ${funcaoCard}
                                <div>
                                    <div class="photo-pose-detail"><span>${escaparHtml(info.titulo)}</span><b>${escaparHtml(siglaEstilo)}</b></div>
                                    ${info.direcao ? `<div class="text-[9px] text-gray-500 mt-1">Direção: ${escaparHtml(info.direcao)}</div>` : ''}
                                </div>
                            </div>
                            <button data-download-url="${encodeURIComponent(urlDownloadOriginal)}" data-download-name="${encodeURIComponent(nomeArquivo)}" data-member-id="${escaparHtml(membro.playerId || '')}" data-pose="${escaparHtml(siglaEstilo)}" class="btn-download photo-download-btn">
                                <span>Baixar Foto</span><b>↓</b>
                            </button>
                        </div>
                    </article>
                `;
            });

            if (contadorEncontrados === 0) {
                container.innerHTML += `
                    <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                        <div class="text-4xl mb-4">▧</div>
                        <h2 class="text-xl font-bold text-white mb-2">Acervo ainda não disponível</h2>
                        <p class="text-gray-300 text-sm">Nenhuma fotografia foi cadastrada para este jogador.</p>
                    </div>
                `;
            } else {
                container.innerHTML += htmlCards;
                ativarLazyMedia();
            }

            irParaTopo();
        }

        function abrirPastaLogosEBrasoes(tipo) {
            nivelAtual = 'generica';

            titulo.innerText = `${equipeSelecionada.nome} - ${tipo}`;
            subtitulo.innerText = `Pasta: ${tipo}`;

            if (scope === 'all') {
                configurarNavegacao('all');
                btnVoltar.innerText = '← Voltar para equipe';
            } else {
                configurarNavegacao('team');
                btnVoltar.innerText = '← Voltar para equipe';
            }

            let itens = [];

            if (tipo === 'Logotipos') {
                itens = equipeSelecionada.logos || [];
            } else {
                itens = equipeSelecionada.brasoes || [];
            }

            const itensValidos = itens.filter(item => {
                const val = typeof item === 'string' ? item : (item.id || item.link);
                return val && val.trim() !== "" && !val.includes("SEU_ID");
            });

            if (itensValidos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                        <div class="text-5xl mb-4">📂</div>
                        <h2 class="text-xl font-bold text-white mb-2">Nenhum ${tipo.slice(0, -1).toLowerCase()} cadastrado com ID do Drive</h2>
                        <p class="text-gray-300 text-sm mb-4">Insira os IDs do Google Drive no arquivo dados.js para esta equipe.</p>
                    </div>
                `;

                irParaTopo();
                return;
            }

            let htmlCards = '';

            itensValidos.forEach((item, idx) => {
                const valorBruto = typeof item === 'string' ? item : (item.id || item.link);
                const nomeItem = typeof item === 'object' && item.nome
                    ? item.nome
                    : `${tipo.slice(0, -1)} ${idx + 1}`;

                const urlDownloadOriginal = processarLinkDrive(valorBruto);
                const urlDriveImg = processarLinkDrivePreview(valorBruto, 480);
                const nomeArquivo = nomeArquivoGenerico(nomeItem);

                htmlCards += `
                    <div class="asset-preview-card">
                        <div class="asset-preview-stage">
                            <span class="asset-preview-label">${tipo === 'Logotipos' ? 'LOGO ASSET' : 'CREST ASSET'}</span>
                            <div class="asset-preview-image-wrap">
                                <img data-src="${urlDriveImg}" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="${escaparHtml(nomeItem)}" class="asset-preview-image lazy-media" loading="lazy" decoding="async" fetchpriority="low" onerror="this.src='info-ffws/logoffws.png'">
                            </div>
                        </div>
                        <div class="asset-preview-info">
                            <div>
                                <span class="asset-preview-kicker">${tipo}</span>
                                <h2 title="${escaparHtml(nomeItem)}">${escaparHtml(nomeItem)}</h2>
                            </div>
                            <button data-download-url="${encodeURIComponent(urlDownloadOriginal)}" data-download-name="${encodeURIComponent(nomeArquivo)}" class="btn-download asset-download-btn">
                                <span>Baixar arquivo</span><b>↓</b>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlCards;
            ativarLazyMedia();
            irParaTopo();
        }

        function abrirEstilo(indexEstilo) {
            estiloSelecionado = listaEstilos[indexEstilo];
            nivelAtual = 'fotos';

            const nomeFormatado = formatarTitulo(estiloSelecionado.nomeEstilo);

            titulo.innerText = `${equipeSelecionada.nome} - ${nomeFormatado}`;
            subtitulo.innerText = `Pasta: ${nomeFormatado}`;
            const poseDownloadToolbar = `<div class="bulk-toolbar"><div><div class="bulk-toolbar-title">POSE MEDIA DOWNLOAD</div><div class="text-white text-xs font-bold mt-1">${escaparHtml(nomeFormatado)}</div></div><div class="bulk-toolbar-actions"><button class="bulk-btn" onclick="abrirSeletorDownload('pose', equipeSelecionada)">↓ Baixar pasta de pose</button></div></div>`;

            if (scope === 'all') {
                configurarNavegacao('all');
                btnVoltar.innerText = '← Voltar para equipe';
            } else {
                configurarNavegacao('team');
                btnVoltar.innerText = '← Voltar para equipe';
            }

            container.innerHTML = poseDownloadToolbar + `
                <div class="col-span-full flex flex-col items-center justify-center p-16">
                    <div class="loader mb-4"></div>
                    <p class="text-gray-400">Buscando fotos disponíveis...</p>
                </div>
            `;

            if (!equipeSelecionada.membros || equipeSelecionada.membros.length === 0) {
                setTimeout(() => {
                    container.innerHTML = `<p class="text-gray-400 col-span-full text-center">Nenhum membro cadastrado para esta equipe.</p>`;
                }, 400);

                irParaTopo();
                return;
            }

            let htmlCards = '';
            let contadorEncontrados = 0;

            equipeSelecionada.membros.forEach((membro) => {
                const siglaEstilo = estiloSelecionado.sigla;
                const fileId = membro.fotos ? membro.fotos[siglaEstilo] : null;

                if (fileId && fileId.trim() !== "") {
                    contadorEncontrados++;

                    const urlDriveImg = processarLinkDrivePreview(fileId, 720);
                    const nomeArquivo = nomeArquivoJogador(membro, siglaEstilo, 'nick');
                    const funcao = String(membro.funcao || '').trim().toUpperCase();
                    const icone = iconesFuncoes[funcao] || '';

                    const funcaoHtml = funcao && icone
                        ? `<span class="flex items-center gap-1.5 text-xs text-amber-400 font-semibold">
                               <img src="${icone}" alt="${escaparHtml(funcao)}" class="w-5 h-5 object-contain">
                               <span>${escaparHtml(funcao)}</span>
                           </span>`
                        : '';

                    const uidHtml = membro.uid
                        ? `<span class="text-[11px] text-gray-400">UID: ${escaparHtml(membro.uid)}</span>`
                        : '';

                    htmlCards += `
                        <div class="photo-preview-card">
                            <div class="photo-preview-stage">
                                <div class="photo-preview-stage-top">
                                    <span>PLAYER MEDIA</span>
                                    <span>${escaparHtml(siglaEstilo)}</span>
                                </div>
                                <div class="photo-preview-image-wrap">
                                    <img data-src="${urlDriveImg}" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="${escaparHtml(membro.nick)}" class="photo-preview-image lazy-media" loading="lazy" decoding="async" fetchpriority="low" onerror="this.src='info-ffws/logoffws.png'">
                                </div>
                            </div>
                            <div class="photo-preview-info">
                                <div class="photo-identity-row">
                                    <div class="photo-player-identity">
                                        <span class="photo-player-label">PLAYER</span>
                                        <h2 title="${escaparHtml(membro.nick)}">${escaparHtml(membro.nick)}</h2>
                                    </div>
                                    ${uidHtml ? `<span class="photo-player-uid">${uidHtml.replace('<span class="text-[11px] text-gray-400">','').replace('</span>','')}</span>` : ''}
                                </div>
                                <div class="photo-details-row">
                                    ${funcaoHtml ? `<div class="photo-role-pill">${funcaoHtml}</div>` : ''}
                                    <div class="photo-pose-detail"><span>${escaparHtml(nomeFormatado)}</span><b>${escaparHtml(siglaEstilo)}</b></div>
                                </div>
                                <button data-download-url="${encodeURIComponent(urlDriveImg)}" data-download-name="${encodeURIComponent(nomeArquivo)}" data-member-id="${escaparHtml(membro.playerId || '')}" data-pose="${escaparHtml(siglaEstilo)}" class="btn-download photo-download-btn">
                                    <span>Baixar Foto</span><b>↓</b>
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            setTimeout(() => {
                if (contadorEncontrados === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                            <div class="text-5xl mb-4">📂</div>
                            <h2 class="text-xl font-bold text-white mb-2">Nenhuma foto cadastrada nesta pasta</h2>
                            <p class="text-gray-300 text-sm mb-4">Adicione os IDs do Google Drive correspondentes aos membros no arquivo de dados.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = htmlCards;
                    ativarLazyMedia();
                }
            }, 300);

            irParaTopo();
        }

        // Delegação de eventos para evitar problemas com acentos, aspas e caracteres especiais.
        document.addEventListener('click', function(event) {
            const botao = event.target.closest('.btn-download');

            if (!botao) return;

            const url = decodeURIComponent(botao.dataset.downloadUrl || '');
            const nome = decodeURIComponent(botao.dataset.downloadName || 'arquivo.png');
            if (botao.dataset.memberId) {
                const membro = localizarMembroPorId(botao.dataset.memberId);
                const estilo = (listaEstilos || []).find(x => x.sigla === botao.dataset.pose);
                if (membro && estilo) return abrirSeletorDownload('individual', { membro, sigla: estilo.sigla, url });
            }
            abrirSeletorDownload('asset', { url, nome });
        });

        window.onload = inicializarPainel;
    </script>
</body>
</html>
