<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Thin.woff2') format('woff2'), url('fonts/GFF-Latin-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Regular.woff2') format('woff2'), url('fonts/GFF-Latin-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Medium.woff2') format('woff2'), url('fonts/GFF-Latin-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'GFF-Latin', sans-serif;
            font-weight: 400;
            background-image: url('info-ffws/backgroundpainel2type.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        .accent-purple { color: #f74afe; }
        .btn-primary { background-color: #e8b033; color: #1a1a1a; }
        .btn-primary:hover { background-color: #f74afe; color: #fff; }
        .card-hover:hover { border-color: #f74afe; box-shadow: 0 4px 20px rgba(247, 74, 254, 0.2); }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #e8b033;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .idioma-painel { position: fixed; top: 12px; right: 12px; z-index: 80; display:flex; gap:3px; background:#161624e8; border:1px solid rgba(232,176,51,.35); border-radius:10px; padding:4px; }
        .monitor-sidebar { position:fixed; left:10px; top:50%; transform:translateY(-50%); z-index:70; width:54px; background:#10101eeF; border:1px solid rgba(232,176,51,.35); border-radius:14px; padding:7px; box-shadow:0 12px 35px rgba(0,0,0,.35); transition:width .2s ease; }
        .monitor-sidebar.expanded { width:230px; }
        .monitor-sidebar button { width:100%; display:flex; align-items:center; gap:10px; color:#eee; padding:10px 8px; border-radius:9px; text-align:left; }
        .monitor-sidebar button:hover { background:#252538; }
        .monitor-tab-label { display:none; white-space:nowrap; font-size:13px; font-weight:700; }
        .monitor-sidebar.expanded .monitor-tab-label { display:inline; }
        .monitor-panel { display:none; }
        .monitor-panel.active { display:block; }
        @media(max-width:640px){ .monitor-sidebar{left:5px;width:48px}.monitor-sidebar.expanded{width:205px} body{padding-left:0!important} }
    </style>
</head>
<body class="min-h-screen text-gray-100 p-6">

    <script>
        if (sessionStorage.getItem('autenticado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>


    <div class="idioma-painel">
        <button type="button" data-lang-painel="pt" class="lang-painel px-2 py-1 rounded text-xs font-bold">PT</button>
        <button type="button" data-lang-painel="en" class="lang-painel px-2 py-1 rounded text-xs font-bold text-gray-400">EN</button>
        <button type="button" data-lang-painel="es" class="lang-painel px-2 py-1 rounded text-xs font-bold text-gray-400">ES</button>
    </div>

    <aside id="monitor-sidebar" class="monitor-sidebar hidden" aria-label="Monitoramento">
        <button type="button" onclick="toggleMonitorSidebar()" title="Expandir monitoramento"><span class="text-xl">⋮</span><span class="monitor-tab-label" data-mon-i18n="menu">Monitoramento</span></button>
        <div class="border-t border-[#262638] my-2"></div>
        <button type="button" onclick="abrirMonitor('ativos')" title="Usuários ativos"><span>🟢</span><span class="monitor-tab-label" data-mon-i18n="active">Usuários ativos</span></button>
        <button type="button" onclick="abrirMonitor('acessos')" title="Últimos acessos"><span>🕘</span><span class="monitor-tab-label" data-mon-i18n="accesses">Últimos acessos</span></button>
        <button type="button" onclick="abrirMonitor('bloqueados')" title="Tentativas bloqueadas"><span>⛔</span><span class="monitor-tab-label" data-mon-i18n="blocked">Tentativas bloqueadas</span></button>
        <button type="button" onclick="abrirMonitor('alertas')" title="Alertas"><span>🔔</span><span class="monitor-tab-label" data-mon-i18n="alerts">Alertas</span></button>
        <button type="button" onclick="abrirMonitor('sessoes')" title="Sessões / dispositivos"><span>📱</span><span class="monitor-tab-label" data-mon-i18n="sessions">Sessões / dispositivos</span></button>
    </aside>

    <div class="max-w-6xl mx-auto bg-[#10101e]/90 p-6 md:p-8 rounded-2xl shadow-2xl border border-[#e8b033]/30 backdrop-blur-sm">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-[#262638] pb-4 gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-[#1a1a2e] p-2 rounded-lg border border-[#e8b033]/40">
                    <img src="info-ffws/logoffws.png" alt="Logo FFWS" class="h-12 max-w-[120px] object-contain filter drop-shadow-[0_0_8px_rgba(232,176,51,0.8)]">
                </div>
                <div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <h1 id="titulo-pagina" class="text-3xl font-bold text-[#e8b033]">EQUIPES - MEDIA LOBBY</h1>
                        <img id="logo-cabecalho" src="" alt="" class="h-10 max-w-[100px] object-contain hidden filter drop-shadow" onerror="this.classList.add('hidden')">
                    </div>
                    <p id="subtitulo-pagina" class="text-gray-300 text-sm">Selecione uma equipe para acessar as pastas de fotos.</p>
                </div>
            </div>
            <div class="flex gap-2 flex-wrap justify-end">
                <button id="btn-inicio" onclick="renderizarEquipes()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    🏠 Início
                </button>
                <button id="btn-voltar" onclick="voltarNivel()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    ← Voltar para a Pasta de Poses
                </button>
                <button id="btn-sair" onclick="sair()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm transition font-medium shadow-md cursor-pointer">
                    Desconectar do Login
                </button>
            </div>
        </div>

        <div id="conteudo-painel" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    </div>


    <section id="monitor-area" class="hidden max-w-6xl mx-auto mb-6">
        <div class="bg-[#10101e]/95 border border-[#e8b033]/30 rounded-2xl p-5 shadow-2xl backdrop-blur-sm">
            <div class="flex items-center justify-between gap-3 mb-5">
                <div>
                    <h2 id="monitor-titulo" class="text-xl font-bold text-[#e8b033]">Monitoramento</h2>
                    <p id="monitor-subtitulo" class="text-xs text-gray-400">Dados de acesso do Media Lobby.</p>
                </div>
                <button type="button" onclick="fecharMonitor()" class="px-3 py-2 rounded bg-[#1a1a2e] border border-[#e8b033]/40 text-sm">Fechar</button>
            </div>
            <div id="monitor-conteudo"></div>
        </div>
    </section>

    <script src="dados.js"></script>

    <script>
        let nivelAtual = 'equipes'; 
        let equipeSelecionada = null;
        let estiloSelecionado = null;

        const scope = sessionStorage.getItem('user_scope');
        const userEmail = sessionStorage.getItem('user_email') || '';
        let userData = {};
        try { userData = JSON.parse(sessionStorage.getItem('user_data') || '{}'); } catch(e) {}
        const podeMonitorar = sessionStorage.getItem('pode_monitorar') === 'true' || userData.tipo === 'developer';
        let jogadorSelecionado = null;
        const container = document.getElementById('conteudo-painel');
        const titulo = document.getElementById('titulo-pagina');
        const subtitulo = document.getElementById('subtitulo-pagina');
        const logoCabecalho = document.getElementById('logo-cabecalho');
        const btnVoltar = document.getElementById('btn-voltar');
        const btnInicio = document.getElementById('btn-inicio');
        const btnSair = document.getElementById('btn-sair');

        function irParaTopo() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatarTitulo(texto) {
            return texto.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase());
        }

        function sair() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        function voltarNivel() {
            if (scope === 'player' && jogadorSelecionado) { renderizarJogadorExclusivo(jogadorSelecionado); return; }
            if (equipeSelecionada) {
                abrirEquipe(equipeSelecionada.id);
            } else {
                renderizarEquipes();
            }
        }

        function inicializarPainel() {
            if (podeMonitorar) document.getElementById('monitor-sidebar').classList.remove('hidden');
            aplicarIdiomaPainel();
            if (scope === 'player') {
                const achado = localizarJogadorPorId(userData.playerId || sessionStorage.getItem('player_id'));
                if (achado) {
                    jogadorSelecionado = achado;
                    renderizarJogadorExclusivo(achado);
                } else {
                    titulo.innerText = 'JOGADOR NÃO ENCONTRADO';
                    subtitulo.innerText = 'O playerId deste login não corresponde a nenhum jogador cadastrado.';
                    container.innerHTML = '';
                }
            } else if (scope === 'all') {
                btnSair.classList.remove('hidden');
                renderizarEquipes();
            } else {
                const eq = dadosEquipes.find(e => e.id === scope);
                if (eq) abrirEquipe(eq.id); else renderizarEquipes();
            }
        }

        function localizarJogadorPorId(playerId) {
            if (!playerId) return null;
            for (const eq of dadosEquipes) {
                const membro = (eq.membros || []).find(m => m.playerId === playerId);
                if (membro) return { equipe:eq, jogador:membro };
            }
            return null;
        }


        // Função auxiliar para converter link ou ID do Google Drive em link direto de imagem
        function processarLinkDrive(idOuUrl) {
            if (!idOuUrl) return '';
            let limpo = idOuUrl.trim();
            // Se já for uma URL completa do Google Drive ou lh3, extrai o ID se possível ou usa direto
            if (limpo.includes('drive.google.com') || limpo.includes('id=')) {
                const match = limpo.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    limpo = match[1];
                } else {
                    const match2 = limpo.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (match2 && match2[1]) limpo = match2[1];
                }
            }
            // Se parecer um ID puro do Drive
            if (limpo.length > 20 && !limpo.includes('/')) {
                return `https://lh3.googleusercontent.com/d/${limpo}`;
            }
            return limpo; // Retorna o original caso seja um link local ou externo padrão
        }

        function renderizarEquipes() {
            nivelAtual = 'equipes';
            titulo.innerText = "EQUIPES - MEDIA LOBBY";
            subtitulo.innerText = "Selecione uma equipe para acessar as pastas de fotos.";
            logoCabecalho.classList.add('hidden');
            btnVoltar.classList.add('hidden');
            btnInicio.classList.add('hidden');
            container.innerHTML = '';

            dadosEquipes.forEach(eq => {
                let logoSrc = processarLinkDrive(eq.logo);
                container.innerHTML += `
                    <div onclick="abrirEquipe('${eq.id}')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center">
                        <div class="w-24 h-24 flex items-center justify-center mb-4">
                            <img src="${logoSrc}" alt="${eq.nome}" class="max-h-full max-w-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'">
                        </div>
                        <h2 class="font-bold text-white text-base">${escaparHtml(eq.nome)}</h2>
                        <div class="w-full mt-4 pt-3 border-t border-[#2a2a3f] text-left">
                            <div class="text-[10px] uppercase tracking-wider text-gray-500 mb-2">JOGADORES</div>
                            <div class="flex flex-wrap gap-2">
                                ${(eq.membros || []).map(m => `<span class="px-2 py-1 rounded bg-[#1a1a2e] border border-[#2a2a3f] text-xs text-gray-200 inline-flex items-center gap-1.5">${iconeFuncaoHtml(m.funcao, true)}<span>${escaparHtml(m.nick)}</span></span>`).join('')}
                            </div>
                        </div>
                        <span class="text-xs accent-purple font-semibold mt-4">Ver pastas de estilos →</span>
                    </div>
                `;
            });
            irParaTopo();
        }

        function abrirEquipe(idEquipe) {
            equipeSelecionada = dadosEquipes.find(e => e.id === idEquipe);
            nivelAtual = 'estilos';
            titulo.innerText = equipeSelecionada.nome;
            subtitulo.innerText = "Selecione a pasta desejada:";
            
            logoCabecalho.src = processarLinkDrive(equipeSelecionada.logo);
            logoCabecalho.classList.remove('hidden');

            btnVoltar.classList.add('hidden');
            if (scope === 'all') {
                btnInicio.classList.remove('hidden');
            } else {
                btnInicio.classList.add('hidden');
            }

            container.innerHTML = '';

            // 1. Logotipos (Lendo o array de logos da equipe)
            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Logotipos')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40">
                    <div class="text-4xl mb-3">📁</div>
                    <h2 class="font-bold text-amber-400 text-base">Logotipos</h2>
                    <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                </div>
            `;

            // 2. Brasões (Lendo o array de brasoes da equipe)
            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Brasões')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40">
                    <div class="text-4xl mb-3">📁</div>
                    <h2 class="font-bold text-amber-400 text-base">Brasões</h2>
                    <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                </div>
            `;

            // 3. Demais estilos de fotos dos jogadores
            listaEstilos.forEach((estilo, index) => {
                const nomeFormatado = formatarTitulo(estilo.nomeEstilo);
                container.innerHTML += `
                    <div onclick="abrirEstilo(${index})" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center">
                        <div class="text-4xl mb-3">📁</div>
                        <h2 class="font-bold text-white text-base">${nomeFormatado}</h2>
                        <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                    </div>
                `;
            });
            irParaTopo();
        }

        function abrirPastaLogosEBrasoes(tipo) {
            nivelAtual = 'generica';
            titulo.innerText = `${equipeSelecionada.nome} - ${tipo}`;
            subtitulo.innerText = `Pasta: ${tipo}`;
            
            btnVoltar.classList.remove('hidden');
            btnVoltar.innerText = "← Voltar para a Pasta de Poses";
            if (scope === 'all') {
                btnInicio.classList.remove('hidden');
            }

            // Garante compatibilidade caso o array venha estruturado como .logos/.brasoes ou como propriedades diretas
            let itens = [];
            if (tipo === 'Logotipos') {
                itens = equipeSelecionada.logos || [];
            } else {
                itens = equipeSelecionada.brasoes || [];
            }

            // Filtra itens que possuem ID ou link válido preenchido
            const itensValidos = itens.filter(item => {
                const val = typeof item === 'string' ? item : (item.id || item.link);
                return val && val.trim() !== "" && !val.includes("SEU_ID");
            });

            if (itensValidos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                        <div class="text-5xl mb-4">📂</div>
                        <h2 class="text-xl font-bold text-white mb-2">Nenhum ${tipo.slice(0, -1).toLowerCase()} cadastrado com ID do Drive</h2>
                        <p class="text-gray-300 text-sm mb-4">Insira os IDs do Google Drive no arquivo dados.js para esta equipe.</p>
                    </div>
                `;
                irParaTopo();
                return;
            }

            let htmlCards = '';
            itensValidos.forEach((item, idx) => {
                let valorBruto = typeof item === 'string' ? item : (item.id || item.link);
                let nomeItem = typeof item === 'object' && item.nome ? item.nome : `${tipo.slice(0, -1)} ${idx + 1}`;
                
                let urlDriveImg = processarLinkDrive(valorBruto);
                
                // Extrai o ID limpo para o link de download direto do Google Drive se for o caso
                let matchId = valorBruto.match(/id=([a-zA-Z0-9_-]+)/) || valorBruto.match(/\/d\/([a-zA-Z0-9_-]+)/);
                let idLimpo = matchId ? matchId[1] : (valorBruto.length > 20 && !valorBruto.includes('/') ? valorBruto : '');
                let urlDriveDownload = idLimpo ? `https://drive.google.com/uc?export=download&id=${idLimpo}` : urlDriveImg;

                htmlCards += `
                    <div class="bg-[#161624] border border-[#2a2a3f] p-4 rounded-xl shadow-md flex flex-col justify-between">
                        <div>
                            <div class="w-full h-48 bg-black/40 rounded mb-3 border border-[#2a2a3f] flex items-center justify-center overflow-hidden p-2">
                                <img src="${urlDriveImg}" alt="${nomeItem}" class="w-full h-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'">
                            </div>
                            <h2 class="font-bold text-white text-sm truncate mb-1" title="${nomeItem}">${nomeItem}</h2>
                            <p class="text-xs text-amber-400 font-medium mb-4">${tipo}</p>
                        </div>
                        <a href="${urlDriveDownload}" target="_blank" class="w-full btn-primary py-2 rounded transition text-sm font-semibold shadow-md text-center cursor-pointer block">
                            Baixar Arquivo
                        </a>
                    </div>
                `;
            });

            container.innerHTML = htmlCards;
            irParaTopo();
        }

        async function listarFotosDaPastaDrive(linkPasta) {
            const apiKey = (typeof GOOGLE_DRIVE_FOTOS !== "undefined" && GOOGLE_DRIVE_FOTOS.API_KEY) || "";
            if (!apiKey) {
                throw new Error("Configure GOOGLE_DRIVE_FOTOS.API_KEY no dados.js.");
            }

            const pastaId = extrairIdDrive(linkPasta);
            if (!pastaId) throw new Error("Link da pasta do Google Drive inválido.");

            const arquivos = [];
            let pageToken = "";

            // Uma única consulta paginada por vez, sem carregar a página HTML
            // inteira do Drive. Isso é muito mais rápido.
            do {
                const params = new URLSearchParams({
                    q: `'${pastaId}' in parents and trashed = false`,
                    fields: "nextPageToken,files(id,name,mimeType,size)",
                    pageSize: "1000",
                    key: apiKey
                });
                if (pageToken) params.set("pageToken", pageToken);

                const resp = await fetch(
                    `https://www.googleapis.com/drive/v3/files?${params.toString()}`
                );
                if (!resp.ok) {
                    throw new Error(`Google Drive API retornou ${resp.status}.`);
                }

                const data = await resp.json();

                for (const file of (data.files || [])) {
                    if (!file.mimeType || !file.mimeType.startsWith("image/")) continue;

                    arquivos.push({
                        id: file.id,
                        nome: file.name,
                        mimeType: file.mimeType,
                        tamanho: file.size || "",
                        imagem: `https://drive.google.com/uc?export=view&id=${encodeURIComponent(file.id)}`
                    });
                }

                pageToken = data.nextPageToken || "";
            } while (pageToken);

            return arquivos;
        }

        function escaparHtml(texto) {
            return String(texto ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function baixarFotoDrive(fileId, nomeArquivo, mimeType) {
            const apiKey = (typeof GOOGLE_DRIVE_FOTOS !== "undefined" && GOOGLE_DRIVE_FOTOS.API_KEY) || "";
            if (!apiKey || !fileId) {
                alert("Não foi possível preparar o download desta foto.");
                return;
            }

            const botao = event && event.currentTarget ? event.currentTarget : null;
            const textoOriginal = botao ? botao.innerText : "Baixar Foto";
            if (botao) {
                botao.disabled = true;
                botao.innerText = "Baixando...";
            }

            try {
                // Baixa os bytes para o próprio navegador e cria um Blob local.
                // Assim o clique não abre o Drive nem redireciona para ele.
                const resp = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&key=${encodeURIComponent(apiKey)}`
                );

                if (!resp.ok) {
                    throw new Error(`Não foi possível baixar o arquivo (${resp.status}).`);
                }

                const blob = await resp.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = blobUrl;
                a.download = nomeArquivo || "foto";
                document.body.appendChild(a);
                a.click();
                a.remove();

                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            } catch (erro) {
                console.error("Download:", erro);
                alert("Não foi possível baixar diretamente pelo site. Verifique a API_KEY e as permissões da pasta.");
            } finally {
                if (botao) {
                    botao.disabled = false;
                    botao.innerText = textoOriginal;
                }
            }
        }

        async function abrirEstilo(indexEstilo) {
            estiloSelecionado = listaEstilos[indexEstilo];
            nivelAtual = 'fotos';
            const nomeFormatado = formatarTitulo(estiloSelecionado.nomeEstilo);
            titulo.innerText = `${equipeSelecionada.nome} - ${nomeFormatado}`;
            subtitulo.innerText = `Pasta: ${nomeFormatado}`;
            btnVoltar.classList.remove('hidden');
            btnVoltar.innerText = '← Voltar para a Pasta de Poses';
            if (scope === 'all') btnInicio.classList.remove('hidden');

            const membros = (equipeSelecionada.membros || []).filter(m => m && m.fotos && m.fotos[estiloSelecionado.sigla]);
            container.innerHTML = '';
            if (!membros.length) {
                container.innerHTML = `<div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center"><div class="text-5xl mb-4">📂</div><h2 class="text-xl font-bold text-white mb-2">Nenhuma foto cadastrada</h2><p class="text-gray-400 text-sm">Não há foto desta pose cadastrada no dados.js para esta equipe.</p></div>`;
                return;
            }
            container.innerHTML = membros.map((membro, index) => criarCardFotoJogador(membro, estiloSelecionado.sigla, nomeFormatado, index)).join('');
            irParaTopo();
        }

        function nomeArquivoJogador(nick, sigla, extensao='jpg') {
            const texto=String(nick||'Player').trim();
            const partes=texto.split(/\s+/);
            const tag=partes.shift() || 'TAG';
            const nome=partes.join(' ') || tag;
            // Mantém acentos e caracteres especiais. Apenas separadores de sistema são removidos.
            const seguro=(valor)=>valor.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_');
            return `${seguro(tag)}.${seguro(nome)}_${sigla}.${extensao || 'jpg'}`;
        }

        function extensaoMime(mime){
            const mapa={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'};
            return mapa[mime] || 'jpg';
        }

        function extrairIdDriveLocal(valor){
            if(!valor) return '';
            const s=String(valor);
            const m=s.match(/id=([a-zA-Z0-9_-]+)/) || s.match(/\/d\/([a-zA-Z0-9_-]+)/);
            return m ? m[1] : (s.length>20 && !s.includes('/') ? s : '');
        }

        function urlImagemMembro(valor){
            const id=extrairIdDriveLocal(valor);
            return id ? `https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}` : valor;
        }

        function criarCardFotoJogador(membro, sigla, nomePose, index){
            const original=membro.fotos[sigla];
            const imagem=urlImagemMembro(original);
            const nick=String(membro.nick||'Player');
            const ext='jpg';
            const arquivo=nomeArquivoJogador(nick,sigla,ext);
            return `<div class="bg-[#161624] border border-[#2a2a3f] p-4 rounded-xl shadow-md flex flex-col justify-between">
                <div>
                    <div class="w-full h-56 bg-black/40 rounded mb-3 border border-[#2a2a3f] flex items-center justify-center overflow-hidden p-2">
                        <img src="${escaparHtml(imagem)}" loading="lazy" decoding="async" alt="${escaparHtml(nick)}" class="w-full h-full object-contain" onerror="this.src='info-ffws/logoffws.png'">
                    </div>
                    <h2 class="font-bold text-white text-sm truncate mb-2" title="${escaparHtml(nick)}">${escaparHtml(nick)}</h2>
                    <div class="flex items-center gap-2 text-xs text-gray-300 mb-1">${iconeFuncaoHtml(membro.funcao)}<span>${escaparHtml(membro.funcao || 'FUNÇÃO NÃO INFORMADA')}</span></div>
                    <p class="text-xs text-gray-500 mb-4">UID: <span class="text-gray-300">${escaparHtml(membro.uid || 'Não informado')}</span></p>
                </div>
                <button type="button" onclick="baixarFotoJogador(${JSON.stringify(original)}, ${JSON.stringify(arquivo)}, this)" class="w-full btn-primary py-2 rounded transition text-sm font-semibold shadow-md">Baixar Foto</button>
            </div>`;
        }

        async function baixarFotoJogador(urlOriginal,nomeArquivo,botao){
            const texto=botao?botao.innerText:'';
            if(botao){botao.disabled=true;botao.innerText='Baixando...';}
            try{
                const id=extrairIdDriveLocal(urlOriginal);
                const url=id ? `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}` : urlOriginal;
                const resp=await fetch(url);
                if(!resp.ok) throw new Error('Falha no download');
                const blob=await resp.blob();
                const blobUrl=URL.createObjectURL(blob);
                const a=document.createElement('a'); a.href=blobUrl; a.download=nomeArquivo; document.body.appendChild(a); a.click(); a.remove();
                setTimeout(()=>URL.revokeObjectURL(blobUrl),10000);
            }catch(e){
                // Fallback: abre a origem, mas mantém o nome solicitado sempre que o navegador permitir.
                const a=document.createElement('a'); a.href=urlOriginal; a.download=nomeArquivo; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();
            }finally{if(botao){botao.disabled=false;botao.innerText=texto;}}
        }

        function renderizarJogadorExclusivo(info){
            nivelAtual='player'; equipeSelecionada=info.equipe; jogadorSelecionado=info;
            titulo.innerText=info.jogador.nick;
            subtitulo.innerText=`${info.equipe.nome} • Acesso exclusivo do jogador`;
            logoCabecalho.src=processarLinkDrive(info.equipe.logo); logoCabecalho.classList.remove('hidden');
            btnVoltar.classList.add('hidden'); btnInicio.classList.add('hidden'); btnSair.classList.remove('hidden');
            container.innerHTML='';
            const cards=(listaEstilos||[]).map((estilo,index)=>{
                const url=info.jogador.fotos?.[estilo.sigla];
                if(!url) return '';
                return `<div onclick="abrirEstiloExclusivo(${index})" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center">
                    <div class="text-4xl mb-3">📁</div><h2 class="font-bold text-white text-base">${escaparHtml(formatarTitulo(estilo.nomeEstilo))}</h2><span class="text-xs accent-purple font-semibold mt-2">Abrir foto →</span></div>`;
            }).join('');
            container.innerHTML=cards || `<div class="col-span-full text-center text-gray-400 p-8">Nenhuma foto liberada para este jogador.</div>`;
            irParaTopo();
        }

        function abrirEstiloExclusivo(index){
            estiloSelecionado=listaEstilos[index];
            titulo.innerText=`${jogadorSelecionado.jogador.nick} - ${formatarTitulo(estiloSelecionado.nomeEstilo)}`;
            subtitulo.innerText=`${jogadorSelecionado.equipe.nome} • acesso exclusivo`;
            btnVoltar.classList.remove('hidden'); btnVoltar.innerText='← Voltar para minhas fotos';
            container.innerHTML=criarCardFotoJogador(jogadorSelecionado.jogador,estiloSelecionado.sigla,estiloSelecionado.nomeEstilo,0);
            irParaTopo();
        }


        function iconeFuncaoHtml(funcao, pequeno=false){
            const f=String(funcao||'').toUpperCase();
            const src=(typeof iconesFuncoes!=='undefined' && iconesFuncoes[f]) || '';
            if(!f) return '';
            const cls=pequeno?'w-4 h-4':'w-6 h-6';
            return src ? `<img src="${src}" alt="${escaparHtml(f)}" class="${cls} object-contain inline-block" onerror="this.style.display='none'">` : `<span class="inline-block text-xs">◆</span>`;
        }

        const traducoesPainel={
            pt:{menu:'Monitoramento',active:'Usuários ativos',accesses:'Últimos acessos',blocked:'Tentativas bloqueadas',alerts:'Alertas',sessions:'Sessões / dispositivos'},
            en:{menu:'Monitoring',active:'Active users',accesses:'Recent access',blocked:'Blocked attempts',alerts:'Alerts',sessions:'Sessions / devices'},
            es:{menu:'Monitoreo',active:'Usuarios activos',accesses:'Últimos accesos',blocked:'Intentos bloqueados',alerts:'Alertas',sessions:'Sesiones / dispositivos'}
        };
        function aplicarIdiomaPainel(){
            const lang=localStorage.getItem('mediaLobbyIdioma')||'pt';
            const t=traducoesPainel[lang]||traducoesPainel.pt;
            document.querySelectorAll('[data-lang-painel]').forEach(b=>{const on=b.dataset.langPainel===lang;b.classList.toggle('bg-[#e8b033]',on);b.classList.toggle('text-[#161624]',on);b.classList.toggle('text-gray-400',!on);});
            document.querySelectorAll('[data-mon-i18n]').forEach(el=>{if(t[el.dataset.monI18n])el.textContent=t[el.dataset.monI18n];});
        }
        document.querySelectorAll('[data-lang-painel]').forEach(b=>b.addEventListener('click',()=>{localStorage.setItem('mediaLobbyIdioma',b.dataset.langPainel);aplicarIdiomaPainel();}));
        function toggleMonitorSidebar(){document.getElementById('monitor-sidebar').classList.toggle('expanded');}
        function fecharMonitor(){document.getElementById('monitor-area').classList.add('hidden');}
        function lerMonitorLocal(tipo){
            const acessos=JSON.parse(localStorage.getItem('mediaLobbyAcessos')||'[]');
            const bloqueados=JSON.parse(localStorage.getItem('mediaLobbyTentativasBloqueadas')||'[]');
            if(tipo==='acessos') return acessos;
            if(tipo==='bloqueados') return bloqueados;
            if(tipo==='ativos') return acessos.filter(x=>Date.now()-new Date(x.data).getTime()<30*60*1000);
            if(tipo==='sessoes') return acessos;
            return [];
        }
        async function buscarMonitorBackend(tipo){
            const api=(typeof configuracaoSite!=='undefined'&&configuracaoSite.apiMonitoramento)||'';
            if(!api) return null;
            try{const r=await fetch(api.replace(/\/$/,'')+'/monitor/'+tipo,{headers:{'X-User-Email':userEmail}});if(!r.ok)return null;return await r.json();}catch(e){return null;}
        }
        async function abrirMonitor(tipo){
            if(!podeMonitorar)return;
            const area=document.getElementById('monitor-area'), box=document.getElementById('monitor-conteudo');
            area.classList.remove('hidden'); box.innerHTML='<div class="text-gray-400 p-5">Carregando...</div>';
            const backend=await buscarMonitorBackend(tipo); const dados=backend?.items || backend || lerMonitorLocal(tipo) || [];
            const titulos={ativos:'Usuários ativos',acessos:'Últimos acessos',bloqueados:'Tentativas bloqueadas',alertas:'Alertas',sessoes:'Sessões / dispositivos'};
            document.getElementById('monitor-titulo').textContent=titulos[tipo]||'Monitoramento';
            if(tipo==='alertas'){
                const bloqueados=lerMonitorLocal('bloqueados');
                box.innerHTML=bloqueados.length?bloqueados.map(x=>`<div class="mb-2 p-4 rounded-lg bg-[#161624] border border-red-500/20"><div class="text-red-300 font-bold">⛔ Login bloqueado</div><div class="text-white break-all mt-1">${escaparHtml(x.login)}</div><div class="text-xs text-gray-500 mt-1">${new Date(x.data).toLocaleString()} • ${escaparHtml(x.motivo)}</div></div>`).join(''):'<div class="text-gray-500 p-4">Nenhum alerta registrado.</div>';
                return;
            }
            if(!Array.isArray(dados)||!dados.length){box.innerHTML='<div class="text-gray-500 p-4">Nenhum registro encontrado.</div>';return;}
            box.innerHTML=dados.map(x=>`<div class="mb-2 p-4 rounded-lg bg-[#161624] border border-[#2a2a3f]"><div class="font-bold text-white break-all">${escaparHtml(x.email||x.login||'Login não informado')}</div><div class="text-xs text-gray-400 mt-1">${x.data?new Date(x.data).toLocaleString():''}</div>${x.deviceId?`<div class="text-[11px] text-gray-500 mt-1">Dispositivo: ${escaparHtml(x.deviceId)}</div>`:''}${x.motivo?`<div class="text-xs text-red-300 mt-1">Motivo: ${escaparHtml(x.motivo)}</div>`:''}</div>`).join('');
        }
        window.onload = inicializarPainel;
        window.addEventListener('beforeunload',()=>{ try{ sessionStorage.setItem('last_heartbeat',new Date().toISOString()); }catch(e){} });
    

</script>
</body>
