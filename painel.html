<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Thin.woff2') format('woff2'), url('fonts/GFF-Latin-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Regular.woff2') format('woff2'), url('fonts/GFF-Latin-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Medium.woff2') format('woff2'), url('fonts/GFF-Latin-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'GFF-Latin', sans-serif;
            font-weight: 400;
            background-image: url('info-ffws/backgroundpainel2type.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        .accent-purple { color: #f74afe; }
        .btn-primary { background-color: #e8b033; color: #1a1a1a; }
        .btn-primary:hover { background-color: #f74afe; color: #fff; }
        .card-hover:hover { border-color: #f74afe; box-shadow: 0 4px 20px rgba(247, 74, 254, 0.2); }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #e8b033;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-gray-100 p-6">

    <script>
        if (sessionStorage.getItem('autenticado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="max-w-6xl mx-auto bg-[#10101e]/90 p-6 md:p-8 rounded-2xl shadow-2xl border border-[#e8b033]/30 backdrop-blur-sm">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-[#262638] pb-4 gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-[#1a1a2e] p-2 rounded-lg border border-[#e8b033]/40">
                    <img src="info-ffws/logoffws.png" alt="Logo FFWS" class="h-12 max-w-[120px] object-contain filter drop-shadow-[0_0_8px_rgba(232,176,51,0.8)]">
                </div>
                <div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <h1 id="titulo-pagina" class="text-3xl font-bold text-[#e8b033]">EQUIPES - MEDIA LOBBY</h1>
                        <img id="logo-cabecalho" src="" alt="" class="h-10 max-w-[100px] object-contain hidden filter drop-shadow" onerror="this.classList.add('hidden')">
                    </div>
                    <p id="subtitulo-pagina" class="text-gray-300 text-sm">Selecione uma equipe para acessar as pastas de fotos.</p>
                </div>
            </div>
            <div class="flex gap-2 flex-wrap justify-end">
                <button id="btn-inicio" onclick="renderizarEquipes()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    🏠 Início
                </button>
                <button id="btn-voltar" onclick="voltarNivel()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    ← Voltar para a Pasta de Poses
                </button>
                <button id="btn-sair" onclick="sair()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm transition font-medium shadow-md cursor-pointer">
                    Desconectar do Login
                </button>
            </div>
        </div>

        <div id="conteudo-painel" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    </div>

    <script src="dados.js"></script>

    <script>
        let nivelAtual = 'equipes'; 
        let equipeSelecionada = null;
        let estiloSelecionado = null;

        const scope = sessionStorage.getItem('user_scope');
        const container = document.getElementById('conteudo-painel');
        const titulo = document.getElementById('titulo-pagina');
        const subtitulo = document.getElementById('subtitulo-pagina');
        const logoCabecalho = document.getElementById('logo-cabecalho');
        const btnVoltar = document.getElementById('btn-voltar');
        const btnInicio = document.getElementById('btn-inicio');
        const btnSair = document.getElementById('btn-sair');

        function irParaTopo() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatarTitulo(texto) {
            return texto.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase());
        }

        function sair() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        function voltarNivel() {
            if (equipeSelecionada) {
                abrirEquipe(equipeSelecionada.id);
            } else {
                renderizarEquipes();
            }
        }

        function inicializarPainel() {
            if (scope === 'all') {
                btnSair.classList.remove('hidden');
                renderizarEquipes();
            } else {
                const eq = dadosEquipes.find(e => e.id === scope);
                if (eq) {
                    abrirEquipe(eq.id);
                } else {
                    renderizarEquipes();
                }
            }
        }

        // Função auxiliar para converter link ou ID do Google Drive em link direto de imagem
        function processarLinkDrive(idOuUrl) {
            if (!idOuUrl) return '';
            let limpo = idOuUrl.trim();
            // Se já for uma URL completa do Google Drive ou lh3, extrai o ID se possível ou usa direto
            if (limpo.includes('drive.google.com') || limpo.includes('id=')) {
                const match = limpo.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    limpo = match[1];
                } else {
                    const match2 = limpo.match(/\/d\/([a-zA-Z0-9_-]+)/);
                    if (match2 && match2[1]) limpo = match2[1];
                }
            }
            // Se parecer um ID puro do Drive
            if (limpo.length > 20 && !limpo.includes('/')) {
                return `https://lh3.googleusercontent.com/d/${limpo}`;
            }
            return limpo; // Retorna o original caso seja um link local ou externo padrão
        }

        function renderizarEquipes() {
            nivelAtual = 'equipes';
            titulo.innerText = "EQUIPES - MEDIA LOBBY";
            subtitulo.innerText = "Selecione uma equipe para acessar as pastas de fotos.";
            logoCabecalho.classList.add('hidden');
            btnVoltar.classList.add('hidden');
            btnInicio.classList.add('hidden');
            container.innerHTML = '';

            dadosEquipes.forEach(eq => {
                let logoSrc = processarLinkDrive(eq.logo);
                container.innerHTML += `
                    <div onclick="abrirEquipe('${eq.id}')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center">
                        <div class="w-24 h-24 flex items-center justify-center mb-4">
                            <img src="${logoSrc}" alt="${eq.nome}" class="max-h-full max-w-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'">
                        </div>
                        <h2 class="font-bold text-white text-base">${eq.nome}</h2>
                        <span class="text-xs accent-purple font-semibold mt-2">Ver pastas de estilos →</span>
                    </div>
                `;
            });
            irParaTopo();
        }

        function abrirEquipe(idEquipe) {
            equipeSelecionada = dadosEquipes.find(e => e.id === idEquipe);
            nivelAtual = 'estilos';
            titulo.innerText = equipeSelecionada.nome;
            subtitulo.innerText = "Selecione a pasta desejada:";
            
            logoCabecalho.src = processarLinkDrive(equipeSelecionada.logo);
            logoCabecalho.classList.remove('hidden');

            btnVoltar.classList.add('hidden');
            if (scope === 'all') {
                btnInicio.classList.remove('hidden');
            } else {
                btnInicio.classList.add('hidden');
            }

            container.innerHTML = '';

            // 1. Logotipos (Lendo o array de logos da equipe)
            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Logotipos')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40">
                    <div class="text-4xl mb-3">📁</div>
                    <h2 class="font-bold text-amber-400 text-base">Logotipos</h2>
                    <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                </div>
            `;

            // 2. Brasões (Lendo o array de brasoes da equipe)
            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Brasões')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40">
                    <div class="text-4xl mb-3">📁</div>
                    <h2 class="font-bold text-amber-400 text-base">Brasões</h2>
                    <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                </div>
            `;

            // 3. Demais estilos de fotos dos jogadores
            listaEstilos.forEach((estilo, index) => {
                const nomeFormatado = formatarTitulo(estilo.nomeEstilo);
                container.innerHTML += `
                    <div onclick="abrirEstilo(${index})" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center">
                        <div class="text-4xl mb-3">📁</div>
                        <h2 class="font-bold text-white text-base">${nomeFormatado}</h2>
                        <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                    </div>
                `;
            });
            irParaTopo();
        }

        function abrirPastaLogosEBrasoes(tipo) {
            nivelAtual = 'generica';
            titulo.innerText = `${equipeSelecionada.nome} - ${tipo}`;
            subtitulo.innerText = `Pasta: ${tipo}`;
            
            btnVoltar.classList.remove('hidden');
            btnVoltar.innerText = "← Voltar para a Pasta de Poses";
            if (scope === 'all') {
                btnInicio.classList.remove('hidden');
            }

            // Garante compatibilidade caso o array venha estruturado como .logos/.brasoes ou como propriedades diretas
            let itens = [];
            if (tipo === 'Logotipos') {
                itens = equipeSelecionada.logos || [];
            } else {
                itens = equipeSelecionada.brasoes || [];
            }

            // Filtra itens que possuem ID ou link válido preenchido
            const itensValidos = itens.filter(item => {
                const val = typeof item === 'string' ? item : (item.id || item.link);
                return val && val.trim() !== "" && !val.includes("SEU_ID");
            });

            if (itensValidos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                        <div class="text-5xl mb-4">📂</div>
                        <h2 class="text-xl font-bold text-white mb-2">Nenhum ${tipo.slice(0, -1).toLowerCase()} cadastrado com ID do Drive</h2>
                        <p class="text-gray-300 text-sm mb-4">Insira os IDs do Google Drive no arquivo dados.js para esta equipe.</p>
                    </div>
                `;
                irParaTopo();
                return;
            }

            let htmlCards = '';
            itensValidos.forEach((item, idx) => {
                let valorBruto = typeof item === 'string' ? item : (item.id || item.link);
                let nomeItem = typeof item === 'object' && item.nome ? item.nome : `${tipo.slice(0, -1)} ${idx + 1}`;
                
                let urlDriveImg = processarLinkDrive(valorBruto);
                
                // Extrai o ID limpo para o link de download direto do Google Drive se for o caso
                let matchId = valorBruto.match(/id=([a-zA-Z0-9_-]+)/) || valorBruto.match(/\/d\/([a-zA-Z0-9_-]+)/);
                let idLimpo = matchId ? matchId[1] : (valorBruto.length > 20 && !valorBruto.includes('/') ? valorBruto : '');
                let urlDriveDownload = idLimpo ? `https://drive.google.com/uc?export=download&id=${idLimpo}` : urlDriveImg;

                htmlCards += `
                    <div class="bg-[#161624] border border-[#2a2a3f] p-4 rounded-xl shadow-md flex flex-col justify-between">
                        <div>
                            <div class="w-full h-48 bg-black/40 rounded mb-3 border border-[#2a2a3f] flex items-center justify-center overflow-hidden p-2">
                                <img src="${urlDriveImg}" alt="${nomeItem}" class="w-full h-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'">
                            </div>
                            <h2 class="font-bold text-white text-sm truncate mb-1" title="${nomeItem}">${nomeItem}</h2>
                            <p class="text-xs text-amber-400 font-medium mb-4">${tipo}</p>
                        </div>
                        <a href="${urlDriveDownload}" target="_blank" class="w-full btn-primary py-2 rounded transition text-sm font-semibold shadow-md text-center cursor-pointer block">
                            Baixar Arquivo
                        </a>
                    </div>
                `;
            });

            container.innerHTML = htmlCards;
            irParaTopo();
        }

        async function listarFotosDaPastaDrive(linkPasta) {
            const apiKey = (typeof GOOGLE_DRIVE_FOTOS !== "undefined" && GOOGLE_DRIVE_FOTOS.API_KEY) || "";
            if (!apiKey) {
                throw new Error("Configure GOOGLE_DRIVE_FOTOS.API_KEY no dados.js.");
            }

            const pastaId = extrairIdDrive(linkPasta);
            if (!pastaId) throw new Error("Link da pasta do Google Drive inválido.");

            const arquivos = [];
            let pageToken = "";

            // Uma única consulta paginada por vez, sem carregar a página HTML
            // inteira do Drive. Isso é muito mais rápido.
            do {
                const params = new URLSearchParams({
                    q: `'${pastaId}' in parents and trashed = false`,
                    fields: "nextPageToken,files(id,name,mimeType,size)",
                    pageSize: "1000",
                    key: apiKey
                });
                if (pageToken) params.set("pageToken", pageToken);

                const resp = await fetch(
                    `https://www.googleapis.com/drive/v3/files?${params.toString()}`
                );
                if (!resp.ok) {
                    throw new Error(`Google Drive API retornou ${resp.status}.`);
                }

                const data = await resp.json();

                for (const file of (data.files || [])) {
                    if (!file.mimeType || !file.mimeType.startsWith("image/")) continue;

                    arquivos.push({
                        id: file.id,
                        nome: file.name,
                        mimeType: file.mimeType,
                        tamanho: file.size || "",
                        imagem: `https://drive.google.com/uc?export=view&id=${encodeURIComponent(file.id)}`
                    });
                }

                pageToken = data.nextPageToken || "";
            } while (pageToken);

            return arquivos;
        }

        function escaparHtml(texto) {
            return String(texto ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function baixarFotoDrive(fileId, nomeArquivo, mimeType) {
            const apiKey = (typeof GOOGLE_DRIVE_FOTOS !== "undefined" && GOOGLE_DRIVE_FOTOS.API_KEY) || "";
            if (!apiKey || !fileId) {
                alert("Não foi possível preparar o download desta foto.");
                return;
            }

            const botao = event && event.currentTarget ? event.currentTarget : null;
            const textoOriginal = botao ? botao.innerText : "Baixar Foto";
            if (botao) {
                botao.disabled = true;
                botao.innerText = "Baixando...";
            }

            try {
                // Baixa os bytes para o próprio navegador e cria um Blob local.
                // Assim o clique não abre o Drive nem redireciona para ele.
                const resp = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&key=${encodeURIComponent(apiKey)}`
                );

                if (!resp.ok) {
                    throw new Error(`Não foi possível baixar o arquivo (${resp.status}).`);
                }

                const blob = await resp.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = blobUrl;
                a.download = nomeArquivo || "foto";
                document.body.appendChild(a);
                a.click();
                a.remove();

                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
            } catch (erro) {
                console.error("Download:", erro);
                alert("Não foi possível baixar diretamente pelo site. Verifique a API_KEY e as permissões da pasta.");
            } finally {
                if (botao) {
                    botao.disabled = false;
                    botao.innerText = textoOriginal;
                }
            }
        }

        async function abrirEstilo(indexEstilo) {
            estiloSelecionado = listaEstilos[indexEstilo];
            nivelAtual = 'fotos';

            const nomeFormatado = formatarTitulo(estiloSelecionado.nomeEstilo);
            titulo.innerText = `${equipeSelecionada.nome} - ${nomeFormatado}`;
            subtitulo.innerText = `Pasta: ${nomeFormatado}`;

            btnVoltar.classList.remove('hidden');
            btnVoltar.innerText = "← Voltar para a Pasta de Poses";
            if (scope === 'all') btnInicio.classList.remove('hidden');

            container.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center p-16">
                    <div class="loader mb-4"></div>
                    <p class="text-gray-400">Buscando todas as fotos da pasta do Google Drive...</p>
                </div>
            `;

            try {
                const linkPasta = pastasFotosDrive?.[estiloSelecionado.sigla] || "";
                const arquivos = await listarFotosDaPastaDrive(linkPasta);

                if (!arquivos.length) {
                    container.innerHTML = `
                        <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                            <div class="text-5xl mb-4">📂</div>
                            <h2 class="text-xl font-bold text-white mb-2">Nenhuma foto encontrada</h2>
                            <p class="text-gray-300 text-sm">
                                A pasta existe, mas nenhuma imagem foi encontrada.
                            </p>
                        </div>
                    `;
                    irParaTopo();
                    return;
                }

                let htmlCards = "";

                arquivos.forEach((arquivo, index) => {
                    const nome = escaparHtml(arquivo.nome || `Foto ${index + 1}`);
                    const imagem = escaparHtml(arquivo.imagem);
                    const download = escaparHtml(arquivo.download);

                    htmlCards += `
                        <div class="bg-[#161624] border border-[#2a2a3f] p-4 rounded-xl shadow-md flex flex-col justify-between">
                            <div>
                                <div class="w-full h-56 bg-black/40 rounded mb-3 border border-[#2a2a3f] flex items-center justify-center overflow-hidden p-2">
                                    <img src="${imagem}" loading="lazy" decoding="async" alt="${nome}" class="w-full h-full object-contain filter drop-shadow"
                                         onerror="this.src='info-ffws/logoffws.png'">
                                </div>

                                <h2 class="font-bold text-white text-sm truncate mb-1" title="${nome}">
                                    ${nome}
                                </h2>

                                <p class="text-xs text-amber-400 font-medium mb-4">
                                    ${escaparHtml(nomeFormatado)}
                                </p>
                            </div>

                            <button type="button"
                                onclick="baixarFotoDrive('${arquivo.id}', '${nome.replace("'", "\'")}', '${arquivo.mimeType || "image/jpeg"}')"
                                class="w-full btn-primary py-2 rounded transition text-sm font-semibold shadow-md text-center cursor-pointer block">
                                Baixar Foto
                            </button>
                        </div>
                    `;
                });

                container.innerHTML = htmlCards;

            } catch (erro) {
                console.error("Erro ao carregar fotos do Drive:", erro);

                container.innerHTML = `
                    <div class="col-span-full bg-[#161624] border border-red-500/40 p-8 rounded-xl text-center shadow-md">
                        <div class="text-5xl mb-4">⚠️</div>
                        <h2 class="text-xl font-bold text-white mb-2">
                            Não foi possível carregar as fotos
                        </h2>
                        <p class="text-gray-300 text-sm mb-2">
                            ${escaparHtml(erro.message)}
                        </p>
                        <p class="text-gray-500 text-xs">
                            Confira o link da pasta no dados.js e o compartilhamento da pasta no Google Drive.
                        </p>
                    </div>
                `;
            }

            irParaTopo();
        }

        window.onload = inicializarPainel;
    
        /* =========================================================
           TENTATIVAS BLOQUEADAS — LOGIN IDENTIFICADO
           =========================================================
           Cada registro guarda o email completo que tentou acessar,
           para o Developer saber exatamente qual login precisa ser
           removido/revisado no banco.
        */
        function escaparHtmlMonitoramento(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
            }[c]));
        }

        function registrarTentativaBloqueada(login, motivo = 'limite de dispositivos') {
            const chave = 'mediaLobbyTentativasBloqueadas';
            const lista = JSON.parse(localStorage.getItem(chave) || '[]');

            lista.unshift({
                login: String(login || '').toLowerCase(),
                motivo,
                data: new Date().toISOString(),
                deviceId: localStorage.getItem('mediaLobbyDeviceId') || ''
            });

            localStorage.setItem(chave, JSON.stringify(lista.slice(0, 200)));
        }

        function obterTentativasBloqueadas() {
            return JSON.parse(localStorage.getItem('mediaLobbyTentativasBloqueadas') || '[]');
        }

        function mostrarTentativasBloqueadas() {
            const area = document.getElementById('painel-tentativas-bloqueadas');
            const listaEl = document.getElementById('lista-tentativas-bloqueadas');
            const contadorEl = document.getElementById('contador-tentativas-bloqueadas');

            if (!area || !listaEl) return;

            area.classList.remove('hidden');

            const registros = obterTentativasBloqueadas();
            if (contadorEl) contadorEl.textContent = registros.length;

            if (!registros.length) {
                listaEl.innerHTML = `
                    <div class="rounded-lg border border-[#2a2a3f] bg-[#11111d] p-4 text-sm text-gray-500">
                        Nenhuma tentativa bloqueada registrada.
                    </div>`;
                return;
            }

            listaEl.innerHTML = registros.map((item, index) => `
                <div class="rounded-lg border border-red-500/20 bg-[#11111d] p-4">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                        <div>
                            <div class="text-xs uppercase tracking-wider text-red-300/70 mb-1">LOGIN BLOQUEADO</div>
                            <div class="font-bold text-white break-all">${escaparHtmlMonitoramento(item.login)}</div>
                        </div>
                        <div class="text-xs text-gray-500 sm:text-right">
                            ${new Date(item.data).toLocaleString()}
                        </div>
                    </div>
                    <div class="mt-2 text-xs text-gray-400">
                        Motivo: <span class="text-red-300">${escaparHtmlMonitoramento(item.motivo)}</span>
                    </div>
                </div>
            `).join('');
        }

        // Função pública para a aba de monitoramento.
        window.mostrarTentativasBloqueadas = mostrarTentativasBloqueadas;

        // Quando o frontend detectar uma resposta de bloqueio, o login
        // pode ser registrado aqui antes de retornar para a tela de acesso.
        window.registrarBloqueioLogin = registrarTentativaBloqueada;

</script>
</body>
</html>
