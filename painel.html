<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-gray-100 p-4 md:p-6">

    <script>
        if (!sessionStorage.getItem('auth_token')) {
            window.location.href = '?page=index';
        }
    </script>

    <div class="max-w-6xl mx-auto p-5 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-[#262638] pb-5 gap-5">
            <div class="flex items-center gap-4">
                <div class="bg-white/[.04] p-2 rounded-2xl border border-white/[.09] shadow-lg">
                    <img src="info-ffws/logoffws.png" alt="Logo FFWS" class="h-12 max-w-[120px] object-contain">
                </div>
                <div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <h1 id="titulo-pagina" class="text-3xl font-bold">EQUIPES - MEDIA LOBBY</h1>
                        <img id="logo-cabecalho" src="" alt="" class="h-10 max-w-[100px] object-contain hidden filter drop-shadow" onerror="this.classList.add('hidden')">
                    </div>
                    <p id="subtitulo-pagina" class="text-gray-300 text-sm">Selecione uma equipe para acessar as pastas de fotos.</p>
                     <div class="flex items-center gap-2 mt-3"><span class="inline-block w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,.8)]"></span><span class="text-[9px] tracking-[.18em] text-gray-500 font-bold">MEDIA SYSTEM ONLINE</span></div>
                </div>
            </div>
            <div class="flex gap-2 flex-wrap justify-start md:justify-end">
                <button id="btn-inicio" onclick="renderizarEquipes()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    🏠 Início
                </button>
                <button id="btn-voltar" onclick="voltarNivel()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    ← Voltar para a Pasta de Poses
                </button>
                <button id="btn-sair" onclick="sair()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm transition font-medium shadow-md cursor-pointer">
                    Desconectar do Login
                </button>
            </div>
        </div>

        <div id="conteudo-painel" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 md:gap-6">
        </div>
    </div>

        <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <script>
        let nivelAtual = 'equipes';
        let equipeSelecionada = null;
        let estiloSelecionado = null;

        let dadosEquipes = [];
        let listaEstilos = [];
        let scope = sessionStorage.getItem('user_scope') || '';
        let userType = sessionStorage.getItem('user_type') || 'standard';
        let playerId = sessionStorage.getItem('player_id') || '';

        const container = document.getElementById('conteudo-painel');
        const titulo = document.getElementById('titulo-pagina');
        const subtitulo = document.getElementById('subtitulo-pagina');
        const logoCabecalho = document.getElementById('logo-cabecalho');
        const btnVoltar = document.getElementById('btn-voltar');
        const btnInicio = document.getElementById('btn-inicio');
        const btnSair = document.getElementById('btn-sair');
        const equipesSelecionadas = new Set();

        const iconesFuncoes = {
            RUSHER: 'info-ffws/rusher.png',
            SNIPER: 'info-ffws/sniper.png',
            SUPPORT: 'info-ffws/support.png',
            BOMBER: 'info-ffws/bomber.png',
            RIFLER: 'info-ffws/rifler.png'
        };

        function irParaTopo() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatarTitulo(texto) {
            return texto.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase());
        }

        // Apenas a apresentação das pastas de poses é tratada aqui.
        // As siglas e os dados originais continuam vindo do planilha protegida.
        function obterInfoPastaPose(estilo) {
            const sigla = String(estilo.sigla || '').toUpperCase();
            const nome = String(estilo.nomeEstilo || '').toUpperCase();

            const direcoes = {
                FRENTE: 'Frente',
                DIREITA: 'Direita',
                ESQUERDA: 'Esquerda',
                DIREITO: 'Direito',
                ESQUERDO: 'Esquerdo'
            };

            let titulo = formatarTitulo(estilo.nomeEstilo || 'Pasta de fotos');
            let direcao = '';
            let descricao = 'Retratos oficiais preparados para uso em materiais de transmissão, imprensa e conteúdo digital.';

            if (nome.includes('BRAÇO SOLTO')) {
                titulo = 'Fotos com Braços Soltos';
                direcao = nome.includes('FRENTE') ? 'Frente' : nome.includes('DIREITA') ? 'Direita' : 'Esquerda';
                descricao = 'Retratos oficiais com os braços em posição solta, organizados por direção para facilitar a seleção da mídia.';
            } else if (nome.includes('BRAÇO CRUZADO')) {
                titulo = 'Fotos com Braços Cruzados';
                direcao = nome.includes('FRENTE') ? 'Frente' : nome.includes('DIREITA') ? 'Direita' : 'Esquerda';
                descricao = 'Retratos oficiais com os braços cruzados, separados por direção para uso rápido em peças e conteúdos editoriais.';
            } else if (nome.includes('FOTO DE IDENTIFICAÇÃO')) {
                titulo = 'Foto de Identificação';
                descricao = 'Retrato principal de identificação do jogador, ideal para perfis, escalações e materiais oficiais.';
            } else if (nome.includes('POSE DE BOOYAH')) {
                titulo = 'Pose de Booyah';
                descricao = 'Registro oficial da pose de celebração, preparado para destaques, conteúdos competitivos e materiais de vitória.';
            } else if (nome.includes('POSE DE MVP')) {
                titulo = 'Pose de MVP';
                descricao = 'Retrato especial de destaque do jogador, indicado para conteúdos de MVP e peças de reconhecimento.';
            } else if (nome.includes('FOTO DIVERTIDA')) {
                titulo = 'Fotos Divertidas';
                const numero = nome.match(/\d+/);
                direcao = numero ? `Variação ${numero[0]}` : '';
                descricao = 'Registro descontraído do jogador para conteúdos sociais, bastidores e materiais especiais.';
            } else if (nome.includes('FOTO GIF')) {
                titulo = 'Fotos para GIF';
                const numero = nome.match(/\d+/);
                direcao = numero ? `Variação ${numero[0]}` : '';
                descricao = 'Material fotográfico destinado a animações, GIFs e conteúdos digitais de alta dinâmica.';
            } else if (nome.includes('CLOSE DE PERFIL')) {
                titulo = 'Close de Perfil';
                direcao = nome.includes('DIREITO') ? 'Direito' : 'Esquerdo';
                descricao = 'Enquadramento fechado de perfil, ideal para composições editoriais e materiais de apresentação.';
            } else if (nome.includes('CLOSE DO ROSTO')) {
                titulo = 'Close do Rosto';
                descricao = 'Enquadramento fechado do rosto para materiais de apresentação, identidade visual e conteúdos editoriais.';
            }

            return { codigo: sigla || 'POSE', titulo, direcao, descricao };
        }

        function escaparHtml(texto) {
            return String(texto ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Mantém acentos e caracteres especiais do nick.
        // Troca somente o primeiro espaço, que separa TAG e Nick, por ".".
        // Apenas caracteres proibidos pelo sistema de arquivos são tratados.
        function separarNick(nick) {
            const partes = String(nick || '').trim().split(/\s+/).filter(Boolean);
            const tag = partes[0] || 'PLAYER';
            const nickname = partes.slice(1).join(' ') || tag;
            return { tag, nickname };
        }

        function nomeArquivoJogador(membro, siglaEstilo, modo = 'nick') {
            const uid = String(membro?.uid || 'SEM_UID').trim();
            const { tag, nickname } = separarNick(membro?.nick || 'Jogador');
            if (modo === 'id') return `${uid}.png`;
            const base = `${uid}-${tag}.${nickname}_${siglaEstilo}`.replace(/[\\/:*?"<>|]/g, '-');
            return `${base}.png`;
        }

        function nomeArquivoAsset(nomeItem, modo = 'nick') {
            return nomeArquivoGenerico(nomeItem);
        }

        function nomeArquivoGenerico(nomeItem, extensao = 'png') {
            const base = String(nomeItem || 'arquivo')
                .trim()
                .replace(/[\\/:*?"<>|]/g, '-');

            return `${base}.${extensao}`;
        }

        function sair() {
            sessionStorage.clear();
            window.location.href = '?page=index';
        }

        function voltarNivel() {
            if (userType === 'player') {
                const acesso = localizarJogador();
                if (acesso) abrirEquipeJogador(acesso.equipe, acesso.membro);
                return;
            }

            if (nivelAtual === 'fotos' || nivelAtual === 'generica' || nivelAtual === 'player') {
                if (equipeSelecionada) {
                    abrirEquipe(equipeSelecionada.id);
                } else {
                    renderizarEquipes();
                }
                return;
            }

            if (equipeSelecionada) {
                abrirEquipe(equipeSelecionada.id);
            } else {
                renderizarEquipes();
            }
        }

        function localizarJogador() {
            if (!playerId) return null;

            for (const equipe of dadosEquipes) {
                const membro = (equipe.membros || []).find(m => m.playerId === playerId);

                if (membro) {
                    return { equipe, membro };
                }
            }

            return null;
        }

        function inicializarPainel() {
            if (userType === 'player') {
                const acesso = localizarJogador();

                if (acesso) {
                    equipeSelecionada = acesso.equipe;
                    btnSair.classList.remove('hidden');
                    btnInicio.classList.add('hidden');
                    abrirEquipeJogador(acesso.equipe, acesso.membro);
                } else {
                    btnSair.classList.remove('hidden');

                    titulo.innerText = 'ACESSO NÃO CONFIGURADO';
                    subtitulo.innerText = 'O jogador vinculado a este login não foi encontrado no planilha protegida.';

                    container.innerHTML = `
                        <div class="col-span-full bg-[#161624] border border-red-500/30 p-8 rounded-xl text-center">
                            <div class="text-5xl mb-4">⚠️</div>
                            <h2 class="text-xl font-bold text-white mb-2">Jogador não encontrado</h2>
                            <p class="text-gray-300 text-sm">
                                Verifique o <b>playerId</b> deste login na listaUsuarios.
                            </p>
                        </div>
                    `;
                }

                return;
            }

            if (scope === 'all') {
                btnSair.classList.remove('hidden');
                renderizarEquipes();
            } else {
                const eq = dadosEquipes.find(e => e.id === scope);

                if (eq) {
                    btnSair.classList.remove('hidden');
                    abrirEquipe(eq.id);
                } else {
                    btnSair.classList.remove('hidden');
                    renderizarEquipes();
                }
            }
        }

        function processarLinkDrive(idOuUrl) {
            if (!idOuUrl) return '';

            let limpo = idOuUrl.trim();

            if (limpo.includes('drive.google.com') || limpo.includes('id=')) {
                const match = limpo.match(/id=([a-zA-Z0-9_-]+)/);

                if (match && match[1]) {
                    limpo = match[1];
                } else {
                    const match2 = limpo.match(/\/d\/([a-zA-Z0-9_-]+)/);

                    if (match2 && match2[1]) {
                        limpo = match2[1];
                    }
                }
            }

            if (limpo.length > 20 && !limpo.includes('/')) {
                return `https://lh3.googleusercontent.com/d/${limpo}`;
            }

            return limpo;
        }

        function processarLinkDrivePreview(idOuUrl, tamanho = 220) {
            const url = processarLinkDrive(idOuUrl);
            if (!url) return '';
            if (url.startsWith('https://lh3.googleusercontent.com/d/')) {
                return `${url}=w${tamanho}`;
            }
            return url;
        }

        // URL exclusiva para DOWNLOAD: nunca usa as miniaturas de 480/720px.
        // Para imagens hospedadas no Google Drive, "=s0" solicita o arquivo
        // na resolução original disponível no Drive. Assim, uma foto 1500x1500
        // baixa em 1500x1500, uma 1000x1000 em 1000x1000, etc.
        function processarLinkDriveOriginal(idOuUrl) {
            const url = processarLinkDrive(idOuUrl);
            if (!url) return '';
            if (url.startsWith('https://lh3.googleusercontent.com/d/')) {
                return url.replace(/=(?:w|h|s)\d+(?:-[^/]*)?$/i, '') + '=s0';
            }
            return url;
        }

        function abrirSeletorDownload(contexto, payload) {
            const existente = document.getElementById('download-modal-backdrop');
            if (existente) existente.remove();
            const modal = document.createElement('div');
            modal.id = 'download-modal-backdrop';
            modal.className = 'download-modal-backdrop';
            modal.innerHTML = `
                <div class="download-modal">
                    <h3>Como deseja baixar?</h3>
                    <p>Escolha uma das opções para iniciar o download.</p>
                    <button class="download-choice" data-mode="nick"><b>Baixar com Nickname</b></button>
                    <button class="download-choice" data-mode="id"><b>Baixar com ID</b></button>
                    <button class="download-cancel">Cancelar</button>
                    <div class="download-progress"><i></i></div>
                </div>`;
            document.body.appendChild(modal);
            const close = () => modal.remove();
            modal.querySelector('.download-cancel').onclick = close;
            modal.addEventListener('click', async e => {
                if (e.target === modal) return close();
                const choice = e.target.closest('.download-choice');
                if (!choice) return;
                modal.querySelectorAll('.download-choice').forEach(b => b.disabled = true);
                const progress = modal.querySelector('.download-progress i');
                try {
                    await executarDownload(contexto, payload, choice.dataset.mode, progress);
                    modal.querySelector('h3').textContent = 'Download concluído';
                    modal.querySelector('p').textContent = 'O arquivo foi preparado com o padrão escolhido.';
                    setTimeout(close, 900);
                } catch (err) {
                    console.error(err);
                    modal.querySelector('h3').textContent = 'Não foi possível concluir';
                    modal.querySelector('p').textContent = 'Algumas imagens podem bloquear downloads externos. Tente novamente.';
                    modal.querySelectorAll('.download-choice').forEach(b => b.disabled = false);
                }
            });
        }

        async function baixarArquivo(url, nomeArquivo) {
            try {
                const response = await fetch(url, { mode: 'cors' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = nomeArquivo;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
                return true;
            } catch (error) {
                const a = document.createElement('a');
                a.href = url;
                a.target = '_blank';
                a.download = nomeArquivo;
                document.body.appendChild(a);
                a.click();
                a.remove();
                return false;
            }
        }

        async function obterBlob(url) {
            const response = await fetch(url, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.blob();
        }

        function coletarFotosMembro(membro, modo, prefixo = '') {
            const itens = [];
            (listaEstilos || []).forEach(estilo => {
                const fileId = membro?.fotos?.[estilo.sigla];
                if (!fileId || !String(fileId).trim()) return;
                const nome = nomeArquivoJogador(membro, estilo.sigla, modo);
                const pastaPose = String(estilo.sigla || 'POSE').replace(/[\\/:*?"<>|]/g, '-');
                itens.push({
                    url: processarLinkDriveOriginal(fileId),
                    nome,
                    caminho: prefixo ? `${prefixo}/${pastaPose}/${nome}` : `${pastaPose}/${nome}`
                });
            });
            return itens;
        }

        function coletarFotosEquipe(equipe, modo, incluirPasta = true) {
            const itens = [];
            (equipe.membros || []).forEach(membro => {
                const fotos = coletarFotosMembro(membro, modo, incluirPasta ? 'FOTOS' : '');
                fotos.forEach(item => itens.push(item));
            });
            return itens;
        }

        function coletarAssetsEquipe(equipe) {
            const itens = [];
            [['Logotipos', equipe.logos || []], ['Brasoes', equipe.brasoes || []]].forEach(([pasta, lista]) => {
                lista.forEach((item, idx) => {
                    const valor = typeof item === 'string' ? item : (item.id || item.link);
                    if (!valor || !String(valor).trim() || String(valor).includes('SEU_ID')) return;
                    const nome = (typeof item === 'object' && item.nome) ? item.nome : `${pasta}_${idx + 1}`;
                    itens.push({ url: processarLinkDriveOriginal(valor), nome: nomeArquivoGenerico(nome), caminho: `${pasta}/${nomeArquivoGenerico(nome)}` });
                });
            });
            return itens;
        }

        function coletarMediaEquipe(equipe, modo) {
            return [...coletarFotosEquipe(equipe, modo), ...coletarAssetsEquipe(equipe)];
        }

        function coletarPoseEquipe(equipe, estilo, modo) {
            const itens = [];
            (equipe.membros || []).forEach(membro => {
                const fileId = membro?.fotos?.[estilo.sigla];
                if (!fileId || !String(fileId).trim()) return;
                itens.push({
                    url: processarLinkDriveOriginal(fileId),
                    nome: nomeArquivoJogador(membro, estilo.sigla, modo),
                    caminho: nomeArquivoJogador(membro, estilo.sigla, modo)
                });
            });
            return itens;
        }

        async function baixarLoteZip(nomeZip, itens, progress) {
            if (!window.JSZip) throw new Error('Biblioteca ZIP não carregada.');
            if (!itens.length) throw new Error('Nenhum arquivo disponível.');
            const zip = new JSZip();
            let concluidos = 0;
            for (const item of itens) {
                try {
                    const blob = await obterBlob(item.url);
                    zip.file(item.caminho || item.nome, blob);
                } catch (e) {
                    console.warn('Arquivo ignorado:', item.url, e);
                }
                concluidos++;
                if (progress) progress.style.width = `${Math.round((concluidos / itens.length) * 85)}%`;
            }
            const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, meta => {
                if (progress) progress.style.width = `${85 + Math.round(meta.percent * .15)}%`;
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${nomeZip}.zip`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        async function executarDownload(contexto, payload, modo, progress) {
            if (contexto === 'individual') {
                const item = payload;
                const blob = await obterBlob(item.url);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = nomeArquivoJogador(item.membro, item.sigla, modo);
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1200);
                if (progress) progress.style.width = '100%';
                return;
            }
            if (contexto === 'asset') {
                const item = payload;
                const blob = await obterBlob(item.url);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = item.nome;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1200);
                if (progress) progress.style.width = '100%';
                return;
            }
            if (contexto === 'pose') {
                await baixarLoteZip(`${equipeSelecionada.nome}_${estiloSelecionado.sigla}`, coletarPoseEquipe(equipeSelecionada, estiloSelecionado, modo), progress);
                return;
            }
            if (contexto === 'team') {
                const itens = coletarMediaEquipe(payload, modo);
                await baixarLoteZip(payload.nome, itens, progress);
                return;
            }
            if (contexto === 'all') {
                const equipes = payload;
                const itens = [];
                equipes.forEach(eq => coletarMediaEquipe(eq, modo).forEach(item => itens.push({ ...item, caminho: `${eq.nome}/${item.caminho}` })));
                await baixarLoteZip('MEDIA_LOBBY_TODAS_EQUIPES', itens, progress);
                return;
            }
            if (contexto === 'selected') {
                const itens = [];
                payload.forEach(eq => coletarFotosEquipe(eq, modo).forEach(item => itens.push({ ...item, caminho: `${eq.nome}/${item.caminho}` })));
                await baixarLoteZip('MEDIA_LOBBY_EQUIPES_SELECIONADAS', itens, progress);
            }
        }

        function localizarMembroPorId(id) {
            for (const eq of dadosEquipes) {
                const m = (eq.membros || []).find(x => String(x.playerId) === String(id));
                if (m) return m;
            }
            return null;
        }

        function baixarIndividual(membro, estilo) {
            abrirSeletorDownload('individual', { membro, sigla: estilo.sigla, url: processarLinkDriveOriginal(membro.fotos[estilo.sigla]) });
        }

        function toggleEquipeSelecionada(id, checked) {
            if (checked) equipesSelecionadas.add(id); else equipesSelecionadas.delete(id);
            atualizarToolbarSelecao();
        }

        function atualizarToolbarSelecao() {
            const btn = document.getElementById('btn-download-selected');
            const count = document.getElementById('selected-count');
            if (btn) btn.disabled = equipesSelecionadas.size === 0;
            if (count) count.textContent = `${equipesSelecionadas.size} selecionada(s)`;
        }

        function baixarEquipesSelecionadas() {
            renderizarSeletorEquipesDownload();
        }

        function renderizarSeletorEquipesDownload() {
            nivelAtual = 'download-equipes';
            titulo.innerText = 'SELECIONAR EQUIPES';
            subtitulo.innerText = 'Escolha exatamente quais equipes deseja incluir no download.';
            logoCabecalho.classList.add('hidden');
            limparNavegacao();
            btnSair.classList.remove('hidden');

            const selecionadas = new Set(equipesSelecionadas);
            const cards = dadosEquipes.map(eq => {
                const id = escaparHtml(eq.id);
                const checked = selecionadas.has(eq.id) ? 'checked' : '';
                const logo = processarLinkDrive(eq.logo);
                return `
                    <label class="download-team-option">
                        <input type="checkbox" value="${id}" ${checked} onchange="toggleEquipeDownloadPage('${id}', this.checked)">
                        <span class="download-team-check">✓</span>
                        <span class="download-team-logo">${logo ? `<img src="${escaparHtml(logo)}" loading="lazy" decoding="async" fetchpriority="low" alt="">` : ''}</span>
                        <span class="download-team-name">${escaparHtml(eq.nome)}</span>
                        <span class="download-team-meta">${(eq.membros || []).length} PLAYERS</span>
                    </label>`;
            }).join('');

        function ativarLazyMedia() {
            const imagens = document.querySelectorAll('img.lazy-media[data-src]');
            if (!imagens.length) return;
            const carregar = img => {
                if (img.dataset.loaded) return;
                img.src = img.dataset.src;
                img.dataset.loaded = '1';
                img.removeAttribute('data-src');
            };
            if (!('IntersectionObserver' in window)) return imagens.forEach(carregar);
            const obs = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { carregar(entry.target); obs.unobserve(entry.target); }
                });
            }, { rootMargin: '80px 0px', threshold: 0.01 });
            imagens.forEach(img => obs.observe(img));
        }

            let contadorEncontrados = 0;

            equipeSelecionada.membros.forEach((membro) => {
                const siglaEstilo = estiloSelecionado.sigla;
                const fileId = membro.fotos ? membro.fotos[siglaEstilo] : null;

                if (fileId && fileId.trim() !== "") {
                    contadorEncontrados++;

                    const urlDriveImg = processarLinkDrivePreview(fileId, 720);
                    const nomeArquivo = nomeArquivoJogador(membro, siglaEstilo, 'nick');
                    const funcao = String(membro.funcao || '').trim().toUpperCase();
                    const icone = iconesFuncoes[funcao] || '';

                    const funcaoHtml = funcao && icone
                        ? `<span class="flex items-center gap-1.5 text-xs text-amber-400 font-semibold">
                               <img src="${icone}" alt="${escaparHtml(funcao)}" class="w-5 h-5 object-contain">
                               <span>${escaparHtml(funcao)}</span>
                           </span>`
                        : '';

                    const uidHtml = membro.uid
                        ? `<span class="text-[11px] text-gray-400">UID: ${escaparHtml(membro.uid)}</span>`
                        : '';

                    htmlCards += `
                        <div class="photo-preview-card">
                            <div class="photo-preview-stage">
                                <div class="photo-preview-stage-top">
                                    <span>PLAYER MEDIA</span>
                                    <span>${escaparHtml(siglaEstilo)}</span>
                                </div>
                                <div class="photo-preview-image-wrap">
                                    <img data-src="${urlDriveImg}" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="${escaparHtml(membro.nick)}" class="photo-preview-image lazy-media" loading="lazy" decoding="async" fetchpriority="low" onerror="this.src='info-ffws/logoffws.png'">
                                </div>
                            </div>
                            <div class="photo-preview-info">
                                <div class="photo-identity-row">
                                    <div class="photo-player-identity">
                                        <span class="photo-player-label">PLAYER</span>
                                        <h2 title="${escaparHtml(membro.nick)}">${escaparHtml(membro.nick)}</h2>
                                    </div>
                                    ${uidHtml ? `<span class="photo-player-uid">${uidHtml.replace('<span class="text-[11px] text-gray-400">','').replace('</span>','')}</span>` : ''}
                                </div>
                                <div class="photo-details-row">
                                    ${funcaoHtml ? `<div class="photo-role-pill">${funcaoHtml}</div>` : ''}
                                    <div class="photo-pose-detail"><span>${escaparHtml(nomeFormatado)}</span><b>${escaparHtml(siglaEstilo)}</b></div>
                                </div>
                                <button data-download-url="${encodeURIComponent(processarLinkDriveOriginal(fileId))}" data-download-name="${encodeURIComponent(nomeArquivo)}" data-member-id="${escaparHtml(membro.playerId || '')}" data-pose="${escaparHtml(siglaEstilo)}" class="btn-download photo-download-btn">
                                    <span>Baixar Foto</span><b>↓</b>
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            setTimeout(() => {
                if (contadorEncontrados === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                            <div class="text-5xl mb-4">📂</div>
                            <h2 class="text-xl font-bold text-white mb-2">Nenhuma foto cadastrada nesta pasta</h2>
                            <p class="text-gray-300 text-sm mb-4">Adicione os IDs do Google Drive correspondentes aos membros no arquivo de dados.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = htmlCards;
                    ativarLazyMedia();
                }
            }, 300);

            irParaTopo();
        }

        // Delegação de eventos para evitar problemas com acentos, aspas e caracteres especiais.
        document.addEventListener('click', function(event) {
            const botao = event.target.closest('.btn-download');

            if (!botao) return;

            const url = decodeURIComponent(botao.dataset.downloadUrl || '');
            const nome = decodeURIComponent(botao.dataset.downloadName || 'arquivo.png');
            if (botao.dataset.memberId) {
                const membro = localizarMembroPorId(botao.dataset.memberId);
                const estilo = (listaEstilos || []).find(x => x.sigla === botao.dataset.pose);
                if (membro && estilo) return abrirSeletorDownload('individual', { membro, sigla: estilo.sigla, url });
            }

            // Logos e brasões são assets da equipe: não possuem UID/nickname.
            // O download deve acontecer diretamente, sem abrir o seletor de nomes.
            baixarArquivo(url, nome).catch(err => console.error('Erro ao baixar asset:', err));
        });

        async function iniciarPainelSeguro() {
            const token = sessionStorage.getItem('auth_token');
            if (!token) { window.location.href = '?page=index'; return; }
            google.script.run.withSuccessHandler(function(result) {
                if (!result || !result.ok) {
                    sessionStorage.clear();
                    window.location.href = '?page=index';
                    return;
                }
                dadosEquipes = result.dadosEquipes || [];
                listaEstilos = result.listaEstilos || [];
                scope = result.scope || '';
                userType = result.userType || 'standard';
                playerId = result.playerId || '';
                inicializarPainel();
            }).withFailureHandler(function() {
                sessionStorage.clear();
                window.location.href = '?page=index';
            }).getAuthorizedData(token);
        }

        window.onload = iniciarPainelSeguro;
    </script>
</body>
</html>
