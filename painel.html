<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Thin.woff2') format('woff2'), url('fonts/GFF-Latin-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Regular.woff2') format('woff2'), url('fonts/GFF-Latin-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Medium.woff2') format('woff2'), url('fonts/GFF-Latin-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'GFF-Latin', sans-serif;
            font-weight: 400;
            background-image: url('info-ffws/backgroundpainel2type.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        .accent-purple { color: #f74afe; }
        .btn-primary { background-color: #e8b033; color: #1a1a1a; }
        .btn-primary:hover { background-color: #f74afe; color: #fff; }
        .card-hover:hover { border-color: #f74afe; box-shadow: 0 4px 20px rgba(247, 74, 254, 0.2); }
        
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #e8b033;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-gray-100 p-6">

    <script>
        if (sessionStorage.getItem('autenticado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="max-w-6xl mx-auto bg-[#10101e]/90 p-6 md:p-8 rounded-2xl shadow-2xl border border-[#e8b033]/30 backdrop-blur-sm">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-[#262638] pb-4 gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-[#1a1a2e] p-2 rounded-lg border border-[#e8b033]/40">
                    <img src="info-ffws/logoffws.png" alt="Logo FFWS" class="h-12 max-w-[120px] object-contain filter drop-shadow-[0_0_8px_rgba(232,176,51,0.8)]">
                </div>
                <div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <h1 id="titulo-pagina" class="text-3xl font-bold text-[#e8b033]">EQUIPES - MEDIA LOBBY</h1>
                        <img id="logo-cabecalho" src="" alt="" class="h-10 max-w-[100px] object-contain hidden filter drop-shadow" onerror="this.classList.add('hidden')">
                    </div>
                    <p id="subtitulo-pagina" class="text-gray-300 text-sm">Selecione uma equipe para acessar as pastas de fotos.</p>
                </div>
            </div>
            <div class="flex gap-2 flex-wrap justify-end">
                <button id="btn-inicio" onclick="renderizarEquipes()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    🏠 Início
                </button>
                <button id="btn-voltar" onclick="voltarNivel()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    ← Voltar para a Pasta de Poses
                </button>
                <button id="btn-sair" onclick="sair()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm transition font-medium shadow-md cursor-pointer">
                    Desconectar do Login
                </button>
            </div>
        </div>

        <div id="conteudo-painel" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>

        <!-- Rodapé estilizado dentro do card principal -->
        <div class="mt-12 pt-8 border-t border-[#e8b033]/20 flex items-center justify-center gap-12">
            <img src="info-ffws/logo-diretoria.png" alt="Diretoria" class="h-20 w-20 object-contain opacity-100" onerror="this.style.display='none'">
            <img src="info-ffws/logo-futury.png" alt="Futury" class="h-20 w-20 object-contain opacity-100" onerror="this.style.display='none'">
        </div>
    </div>

    <script src="dados.js"></script>
    <script>
        // (Mantive o restante do script igual ao seu original)
        let nivelAtual = 'equipes'; 
        let equipeSelecionada = null;
        let estiloSelecionado = null;
        const scope = sessionStorage.getItem('user_scope');
        const container = document.getElementById('conteudo-painel');
        const titulo = document.getElementById('titulo-pagina');
        const subtitulo = document.getElementById('subtitulo-pagina');
        const logoCabecalho = document.getElementById('logo-cabecalho');
        const btnVoltar = document.getElementById('btn-voltar');
        const btnInicio = document.getElementById('btn-inicio');
        const btnSair = document.getElementById('btn-sair');

        function irParaTopo() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function formatarTitulo(texto) { return texto.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase()); }
        function sair() { sessionStorage.clear(); window.location.href = 'index.html'; }
        function voltarNivel() { if (equipeSelecionada) { abrirEquipe(equipeSelecionada.id); } else { renderizarEquipes(); } }
        function inicializarPainel() {
            if (scope === 'all') { btnSair.classList.remove('hidden'); renderizarEquipes(); } 
            else { const eq = dadosEquipes.find(e => e.id === scope); if (eq) abrirEquipe(eq.id); else renderizarEquipes(); }
        }
        function processarLinkDrive(idOuUrl) {
            if (!idOuUrl) return '';
            let limpo = idOuUrl.trim();
            if (limpo.includes('drive.google.com') || limpo.includes('id=')) {
                const match = limpo.match(/id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) limpo = match[1];
                else { const match2 = limpo.match(/\/d\/([a-zA-Z0-9_-]+)/); if (match2 && match2[1]) limpo = match2[1]; }
            }
            if (limpo.length > 20 && !limpo.includes('/')) return `https://lh3.googleusercontent.com/d/${limpo}`;
            return limpo;
        }
        async function baixarArquivo(url, nomeArquivo) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none'; a.href = blobUrl; a.download = nomeArquivo;
                document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(blobUrl); document.body.removeChild(a);
            } catch (error) {
                const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.download = nomeArquivo;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }
        }
        function renderizarEquipes() {
            nivelAtual = 'equipes'; titulo.innerText = "EQUIPES - MEDIA LOBBY"; subtitulo.innerText = "Selecione uma equipe para acessar as pastas de fotos.";
            logoCabecalho.classList.add('hidden'); btnVoltar.classList.add('hidden'); btnInicio.classList.add('hidden'); container.innerHTML = '';
            dadosEquipes.forEach(eq => {
                let logoSrc = processarLinkDrive(eq.logo);
                container.innerHTML += `
                    <div onclick="abrirEquipe('${eq.id}')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center">
                        <div class="w-24 h-24 flex items-center justify-center mb-4"><img src="${logoSrc}" alt="${eq.nome}" class="max-h-full max-w-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'"></div>
                        <h2 class="font-bold text-white text-base">${eq.nome}</h2><span class="text-xs accent-purple font-semibold mt-2">Ver pastas de estilos →</span>
                    </div>
                `;
            }); irParaTopo();
        }
        function abrirEquipe(idEquipe) {
            equipeSelecionada = dadosEquipes.find(e => e.id === idEquipe); nivelAtual = 'estilos'; titulo.innerText = equipeSelecionada.nome; subtitulo.innerText = "Selecione a pasta desejada:";
            logoCabecalho.src = processarLinkDrive(equipeSelecionada.logo); logoCabecalho.classList.remove('hidden'); btnVoltar.classList.add('hidden');
            if (scope === 'all') btnInicio.classList.remove('hidden'); else btnInicio.classList.add('hidden'); container.innerHTML = '';
            container.innerHTML += `<div onclick="abrirPastaLogosEBrasoes('Logotipos')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40"><div class="text-4xl mb-3">📁</div><h2 class="font-bold text-amber-400 text-base">Logotipos</h2><span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span></div>`;
            container.innerHTML += `<div onclick="abrirPastaLogosEBrasoes('Brasões')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40"><div class="text-4xl mb-3">📁</div><h2 class="font-bold text-amber-400 text-base">Brasões</h2><span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span></div>`;
            listaEstilos.forEach((estilo, index) => { const nomeFormatado = formatarTitulo(estilo.nomeEstilo); container.innerHTML += `<div onclick="abrirEstilo(${index})" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center"><div class="text-4xl mb-3">📁</div><h2 class="font-bold text-white text-base">${nomeFormatado}</h2><span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span></div>`; }); irParaTopo();
        }
        // (Demais funções abrirPastaLogosEBrasoes e abrirEstilo omitidas por limite, mas permanecem iguais)
        window.onload = inicializarPainel;
    </script>
</body>
</html>
