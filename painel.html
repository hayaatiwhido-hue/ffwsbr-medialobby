<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Thin.woff2') format('woff2'), url('fonts/GFF-Latin-Thin.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Regular.woff2') format('woff2'), url('fonts/GFF-Latin-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Medium.woff2') format('woff2'), url('fonts/GFF-Latin-Medium.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
        }

        body {
            font-family: 'GFF-Latin', sans-serif;
            font-weight: 400;
            background-image: url('info-ffws/backgroundpainel2type.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
        }

        .accent-purple { color: #f74afe; }
        .btn-primary { background-color: #e8b033; color: #1a1a1a; }
        .btn-primary:hover { background-color: #f74afe; color: #fff; }
        .card-hover:hover { border-color: #f74afe; box-shadow: 0 4px 20px rgba(247, 74, 254, 0.2); }

        /* Prévia das equipes na tela inicial */
        .team-preview-card {
            width: 100%;
            min-height: 170px;
        }
        .team-preview-left {
            width: 150px;
            min-width: 150px;
        }
        .team-preview-logo {
            width: 82px;
            height: 82px;
        }
        .team-preview-name {
            line-height: 1.1;
            max-width: 145px;
        }
        .team-player-list {
            min-width: 0;
        }
        .team-player-chip {
            background: rgba(26, 26, 46, 0.92);
            border: 1px solid #2a2a3f;
            min-height: 38px;
        }
        .team-player-chip:hover {
            border-color: rgba(247, 74, 254, 0.65);
            background: rgba(37, 37, 56, 0.95);
        }
        .team-player-icon {
            width: 24px;
            height: 24px;
            flex: 0 0 24px;
        }
        @media (max-width: 640px) {
            .team-preview-card {
                min-height: 150px;
            }
            .team-preview-left {
                width: 118px;
                min-width: 118px;
            }
            .team-preview-logo {
                width: 68px;
                height: 68px;
            }
            .team-preview-name {
                max-width: 118px;
                font-size: 0.9rem;
            }
            .team-player-chip {
                min-height: 34px;
                padding: 6px 9px;
            }
            .team-player-icon {
                width: 21px;
                height: 21px;
                flex-basis: 21px;
            }
        }
        
        /* Pastas de poses dentro da equipe — biblioteca de mídia profissional */
        .pose-folder-card {
            position: relative;
            overflow: hidden;
            min-height: 214px;
            background: linear-gradient(145deg, rgba(24,24,40,.98), rgba(15,15,29,.98));
            border: 1px solid #2a2a3f;
            box-shadow: 0 10px 28px rgba(0,0,0,.18);
        }
        .pose-folder-card::before {
            content: '';
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(180deg, #e8b033, #f74afe);
            opacity: .9;
        }
        .pose-folder-card::after {
            content: '';
            position: absolute;
            width: 170px;
            height: 170px;
            right: -90px;
            top: -95px;
            border-radius: 999px;
            background: rgba(247,74,254,.08);
            pointer-events: none;
        }
        .pose-folder-card:hover {
            border-color: rgba(247,74,254,.7);
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(247,74,254,.12);
        }
        .pose-folder-topline {
            letter-spacing: .2em;
            font-size: 9px;
            color: #77778b;
            font-weight: 500;
        }
        .pose-folder-code {
            min-width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232,176,51,.08);
            border: 1px solid rgba(232,176,51,.28);
            color: #e8b033;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
        }
        .pose-folder-direction {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: #b5b5c4;
            font-size: 11px;
            font-weight: 500;
        }
        .pose-folder-direction::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: #f74afe;
            box-shadow: 0 0 10px rgba(247,74,254,.65);
        }
        .pose-folder-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 18px;
            padding-top: 13px;
            border-top: 1px solid #29293b;
        }
        .pose-folder-open {
            color: #f74afe;
            font-size: 12px;
            font-weight: 700;
            transition: transform .2s ease;
        }
        .pose-folder-card:hover .pose-folder-open {
            transform: translateX(3px);
        }
        .pose-folder-meta {
            color: #626276;
            font-size: 9px;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        @media (max-width: 640px) {
            .pose-folder-card {
                min-height: 190px;
            }
            .pose-folder-code {
                min-width: 40px;
                height: 40px;
            }
        }


        /* Área exclusiva do jogador — visual premium */
        .player-hero {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 90% 10%, rgba(247,74,254,.16), transparent 34%),
                radial-gradient(circle at 8% 100%, rgba(232,176,51,.10), transparent 38%),
                linear-gradient(145deg, rgba(27,27,45,.98), rgba(13,13,26,.98));
            border: 1px solid rgba(232,176,51,.32);
            box-shadow: 0 18px 48px rgba(0,0,0,.28);
        }
        .player-hero::before {
            content:''; position:absolute; inset:0; pointer-events:none;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.025) 50%, transparent 100%);
        }
        .player-avatar-ring {
            width: 78px; height: 78px; border-radius: 20px;
            background: #11111f; border:1px solid rgba(232,176,51,.35);
            display:flex; align-items:center; justify-content:center;
            box-shadow: inset 0 0 0 5px rgba(255,255,255,.015), 0 8px 24px rgba(0,0,0,.25);
        }
        .player-stat {
            background: rgba(255,255,255,.025); border:1px solid #2b2b3e;
            border-radius: 12px; padding: 9px 12px;
        }
        .player-stat-label { font-size:8px; letter-spacing:.16em; color:#77778b; text-transform:uppercase; }
        .player-stat-value { font-size:12px; color:#f3f3f7; font-weight:700; margin-top:2px; }
        .player-photo-card {
            position:relative; overflow:hidden; background:linear-gradient(145deg,rgba(25,25,41,.99),rgba(14,14,27,.99));
            border:1px solid #2c2c40; box-shadow:0 14px 35px rgba(0,0,0,.22);
            transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
        }
        .player-photo-card:hover { transform:translateY(-4px); border-color:rgba(247,74,254,.65); box-shadow:0 18px 42px rgba(247,74,254,.10); }
        .player-photo-stage {
            position:relative; height:290px; border-radius:13px; overflow:hidden;
            background:#090912; border:1px solid #29293b;
        }
        .player-photo-stage::after {
            content:''; position:absolute; inset:0; pointer-events:none;
            background:linear-gradient(180deg,rgba(0,0,0,.05) 45%,rgba(0,0,0,.42) 100%);
        }
        .player-photo-tag {
            position:absolute; left:12px; top:12px; z-index:2; padding:6px 9px; border-radius:8px;
            background:rgba(10,10,18,.78); border:1px solid rgba(232,176,51,.35);
            color:#e8b033; font-size:9px; font-weight:700; letter-spacing:.1em;
        }
        .player-photo-index {
            position:absolute; right:12px; top:12px; z-index:2; width:31px; height:31px; border-radius:9px;
            display:flex; align-items:center; justify-content:center; background:rgba(10,10,18,.72);
            border:1px solid #333348; color:#bbbaca; font-size:10px; font-weight:700;
        }
        .player-photo-caption { margin-top:14px; }
        .player-photo-title { font-size:15px; font-weight:700; color:#fff; }
        .player-photo-sub { margin-top:4px; font-size:10px; color:#8d8d9e; letter-spacing:.08em; text-transform:uppercase; }
        .player-download {
            margin-top:14px; height:42px; border-radius:10px; font-size:12px; font-weight:700;
            letter-spacing:.03em; transition:all .2s ease;
        }
        @media (max-width:640px) {
            .player-hero { padding:18px !important; }
            .player-avatar-ring { width:64px; height:64px; border-radius:16px; }
            .player-photo-stage { height:250px; }
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #e8b033;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen text-gray-100 p-6">

    <script>
        if (sessionStorage.getItem('autenticado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="max-w-6xl mx-auto bg-[#10101e]/90 p-6 md:p-8 rounded-2xl shadow-2xl border border-[#e8b033]/30 backdrop-blur-sm">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-[#262638] pb-4 gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-[#1a1a2e] p-2 rounded-lg border border-[#e8b033]/40">
                    <img src="info-ffws/logoffws.png" alt="Logo FFWS" class="h-12 max-w-[120px] object-contain filter drop-shadow-[0_0_8px_rgba(232,176,51,0.8)]">
                </div>
                <div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <h1 id="titulo-pagina" class="text-3xl font-bold text-[#e8b033]">EQUIPES - MEDIA LOBBY</h1>
                        <img id="logo-cabecalho" src="" alt="" class="h-10 max-w-[100px] object-contain hidden filter drop-shadow" onerror="this.classList.add('hidden')">
                    </div>
                    <p id="subtitulo-pagina" class="text-gray-300 text-sm">Selecione uma equipe para acessar as pastas de fotos.</p>
                </div>
            </div>
            <div class="flex gap-2 flex-wrap justify-end">
                <button id="btn-inicio" onclick="renderizarEquipes()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    🏠 Início
                </button>
                <button id="btn-voltar" onclick="voltarNivel()" class="hidden bg-[#1a1a2e] border border-[#e8b033]/50 hover:bg-[#252538] text-gray-200 px-3 py-2 rounded text-sm transition font-medium cursor-pointer">
                    ← Voltar para a Pasta de Poses
                </button>
                <button id="btn-sair" onclick="sair()" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded text-sm transition font-medium shadow-md cursor-pointer">
                    Desconectar do Login
                </button>
            </div>
        </div>

        <div id="conteudo-painel" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    </div>

    <script src="dados.js"></script>

    <script>
        let nivelAtual = 'equipes';
        let equipeSelecionada = null;
        let estiloSelecionado = null;

        const scope = sessionStorage.getItem('user_scope');
        const userType = sessionStorage.getItem('user_type') || 'standard';
        const playerId = sessionStorage.getItem('player_id') || '';

        const container = document.getElementById('conteudo-painel');
        const titulo = document.getElementById('titulo-pagina');
        const subtitulo = document.getElementById('subtitulo-pagina');
        const logoCabecalho = document.getElementById('logo-cabecalho');
        const btnVoltar = document.getElementById('btn-voltar');
        const btnInicio = document.getElementById('btn-inicio');
        const btnSair = document.getElementById('btn-sair');

        const iconesFuncoes = {
            RUSHER: 'info-ffws/rusher.png',
            SNIPER: 'info-ffws/sniper.png',
            SUPPORT: 'info-ffws/support.png',
            BOMBER: 'info-ffws/bomber.png',
            RIFLER: 'info-ffws/rifler.png'
        };

        function irParaTopo() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function formatarTitulo(texto) {
            return texto.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase());
        }

        // Apenas a apresentação das pastas de poses é tratada aqui.
        // As siglas e os dados originais continuam vindo do dados.js.
        function obterInfoPastaPose(estilo) {
            const sigla = String(estilo.sigla || '').toUpperCase();
            const nome = String(estilo.nomeEstilo || '').toUpperCase();

            const direcoes = {
                FRENTE: 'Frente',
                DIREITA: 'Direita',
                ESQUERDA: 'Esquerda',
                DIREITO: 'Direito',
                ESQUERDO: 'Esquerdo'
            };

            let titulo = formatarTitulo(estilo.nomeEstilo || 'Pasta de fotos');
            let direcao = '';
            let descricao = 'Retratos oficiais preparados para uso em materiais de transmissão, imprensa e conteúdo digital.';

            if (nome.includes('BRAÇO SOLTO')) {
                titulo = 'Fotos com Braços Soltos';
                direcao = nome.includes('FRENTE') ? 'Frente' : nome.includes('DIREITA') ? 'Direita' : 'Esquerda';
                descricao = 'Retratos oficiais com os braços em posição solta, organizados por direção para facilitar a seleção da mídia.';
            } else if (nome.includes('BRAÇO CRUZADO')) {
                titulo = 'Fotos com Braços Cruzados';
                direcao = nome.includes('FRENTE') ? 'Frente' : nome.includes('DIREITA') ? 'Direita' : 'Esquerda';
                descricao = 'Retratos oficiais com os braços cruzados, separados por direção para uso rápido em peças e conteúdos editoriais.';
            } else if (nome.includes('FOTO DE IDENTIFICAÇÃO')) {
                titulo = 'Foto de Identificação';
                descricao = 'Retrato principal de identificação do jogador, ideal para perfis, escalações e materiais oficiais.';
            } else if (nome.includes('POSE DE BOOYAH')) {
                titulo = 'Pose de Booyah';
                descricao = 'Registro oficial da pose de celebração, preparado para destaques, conteúdos competitivos e materiais de vitória.';
            } else if (nome.includes('POSE DE MVP')) {
                titulo = 'Pose de MVP';
                descricao = 'Retrato especial de destaque do jogador, indicado para conteúdos de MVP e peças de reconhecimento.';
            } else if (nome.includes('FOTO DIVERTIDA')) {
                titulo = 'Fotos Divertidas';
                const numero = nome.match(/\d+/);
                direcao = numero ? `Variação ${numero[0]}` : '';
                descricao = 'Registro descontraído do jogador para conteúdos sociais, bastidores e materiais especiais.';
            } else if (nome.includes('FOTO GIF')) {
                titulo = 'Fotos para GIF';
                const numero = nome.match(/\d+/);
                direcao = numero ? `Variação ${numero[0]}` : '';
                descricao = 'Material fotográfico destinado a animações, GIFs e conteúdos digitais de alta dinâmica.';
            } else if (nome.includes('CLOSE DE PERFIL')) {
                titulo = 'Close de Perfil';
                direcao = nome.includes('DIREITO') ? 'Direito' : 'Esquerdo';
                descricao = 'Enquadramento fechado de perfil, ideal para composições editoriais e materiais de apresentação.';
            } else if (nome.includes('CLOSE DO ROSTO')) {
                titulo = 'Close do Rosto';
                descricao = 'Enquadramento fechado do rosto para materiais de apresentação, identidade visual e conteúdos editoriais.';
            }

            return { codigo: sigla || 'POSE', titulo, direcao, descricao };
        }

        function escaparHtml(texto) {
            return String(texto ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Mantém acentos e caracteres especiais do nick.
        // Troca somente o primeiro espaço, que separa TAG e Nick, por ".".
        // Apenas caracteres proibidos pelo sistema de arquivos são tratados.
        function nomeArquivoJogador(nick, siglaEstilo) {
            const partes = String(nick || '').trim().split(/\s+/);

            let base = partes.length > 1
                ? `${partes[0]}.${partes.slice(1).join(' ')}`
                : (partes[0] || 'Jogador');

            base = base.replace(/[\\/:*?"<>|]/g, '-');

            return `${base}_${siglaEstilo}.png`;
        }

        function nomeArquivoGenerico(nomeItem, extensao = 'png') {
            const base = String(nomeItem || 'arquivo')
                .trim()
                .replace(/[\\/:*?"<>|]/g, '-');

            return `${base}.${extensao}`;
        }

        function sair() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        function voltarNivel() {
            if (userType === 'player') {
                const acesso = localizarJogador();
                if (acesso) abrirEquipeJogador(acesso.equipe, acesso.membro);
                return;
            }

            if (equipeSelecionada) {
                abrirEquipe(equipeSelecionada.id);
            } else {
                renderizarEquipes();
            }
        }

        function localizarJogador() {
            if (!playerId) return null;

            for (const equipe of dadosEquipes) {
                const membro = (equipe.membros || []).find(m => m.playerId === playerId);

                if (membro) {
                    return { equipe, membro };
                }
            }

            return null;
        }

        function inicializarPainel() {
            if (userType === 'player') {
                const acesso = localizarJogador();

                if (acesso) {
                    equipeSelecionada = acesso.equipe;
                    btnSair.classList.remove('hidden');
                    btnInicio.classList.add('hidden');
                    abrirEquipeJogador(acesso.equipe, acesso.membro);
                } else {
                    btnSair.classList.remove('hidden');

                    titulo.innerText = 'ACESSO NÃO CONFIGURADO';
                    subtitulo.innerText = 'O jogador vinculado a este login não foi encontrado no dados.js.';

                    container.innerHTML = `
                        <div class="col-span-full bg-[#161624] border border-red-500/30 p-8 rounded-xl text-center">
                            <div class="text-5xl mb-4">⚠️</div>
                            <h2 class="text-xl font-bold text-white mb-2">Jogador não encontrado</h2>
                            <p class="text-gray-300 text-sm">
                                Verifique o <b>playerId</b> deste login na listaUsuarios.
                            </p>
                        </div>
                    `;
                }

                return;
            }

            if (scope === 'all') {
                btnSair.classList.remove('hidden');
                renderizarEquipes();
            } else {
                const eq = dadosEquipes.find(e => e.id === scope);

                if (eq) {
                    btnSair.classList.remove('hidden');
                    abrirEquipe(eq.id);
                } else {
                    btnSair.classList.remove('hidden');
                    renderizarEquipes();
                }
            }
        }

        function processarLinkDrive(idOuUrl) {
            if (!idOuUrl) return '';

            let limpo = idOuUrl.trim();

            if (limpo.includes('drive.google.com') || limpo.includes('id=')) {
                const match = limpo.match(/id=([a-zA-Z0-9_-]+)/);

                if (match && match[1]) {
                    limpo = match[1];
                } else {
                    const match2 = limpo.match(/\/d\/([a-zA-Z0-9_-]+)/);

                    if (match2 && match2[1]) {
                        limpo = match2[1];
                    }
                }
            }

            if (limpo.length > 20 && !limpo.includes('/')) {
                return `https://lh3.googleusercontent.com/d/${limpo}`;
            }

            return limpo;
        }

        async function baixarArquivo(url, nomeArquivo) {
            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');

                a.style.display = 'none';
                a.href = blobUrl;

                // O nome é definido diretamente em Unicode.
                // Ex.: LPS.Pão7_FBB.png
                a.download = nomeArquivo;

                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                }, 100);
            } catch (error) {
                // Fallback caso ocorra restrição de CORS.
                const a = document.createElement('a');

                a.href = url;
                a.target = '_blank';
                a.download = nomeArquivo;

                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function renderizarEquipes() {
            nivelAtual = 'equipes';

            titulo.innerText = "EQUIPES - MEDIA LOBBY";
            subtitulo.innerText = "Selecione uma equipe para acessar as pastas de fotos.";

            logoCabecalho.classList.add('hidden');
            btnVoltar.classList.add('hidden');
            btnInicio.classList.add('hidden');

            container.innerHTML = '';

            dadosEquipes.forEach(eq => {
                const logoSrc = processarLinkDrive(eq.logo);
                const membros = Array.isArray(eq.membros) ? eq.membros : [];

                const jogadoresHtml = membros.length
                    ? membros.map(membro => {
                        const funcao = String(membro.funcao || '').trim().toUpperCase();
                        const icone = iconesFuncoes[funcao] || '';
                        const nome = String(membro.nick || 'Jogador').trim();

                        const iconeHtml = icone
                            ? `<img src="${icone}" alt="${escaparHtml(funcao)}" title="${escaparHtml(funcao)}" class="team-player-icon object-contain">`
                            : `<span class="team-player-icon flex items-center justify-center text-sm text-gray-500" title="Função não cadastrada">•</span>`;

                        return `
                            <div class="team-player-chip rounded-lg px-3 py-2 flex items-center gap-2 transition" title="${escaparHtml(funcao ? `${nome} — ${funcao}` : nome)}">
                                ${iconeHtml}
                                <span class="text-sm text-gray-200 font-medium truncate">${escaparHtml(nome)}</span>
                            </div>
                        `;
                    }).join('')
                    : `<div class="text-sm text-gray-500 py-2">Nenhum jogador cadastrado.</div>`;

                container.innerHTML += `
                    <div onclick="abrirEquipe('${escaparHtml(eq.id)}')" class="team-preview-card col-span-full bg-[#161624] border border-[#2a2a3f] p-5 md:p-6 rounded-xl shadow-md cursor-pointer card-hover transition">
                        <div class="flex items-center gap-5 md:gap-7 w-full">

                            <!-- Logo + nome da equipe -->
                            <div class="team-preview-left shrink-0 flex flex-col items-center justify-center text-center">
                                <div class="team-preview-logo flex items-center justify-center mb-3">
                                    <img src="${logoSrc}" alt="${escaparHtml(eq.nome)}" class="max-h-full max-w-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'">
                                </div>
                                <h2 class="team-preview-name font-bold text-white text-base md:text-lg">${escaparHtml(eq.nome)}</h2>
                            </div>

                            <!-- Jogadores + função -->
                            <div class="team-player-list flex-1 min-w-0 border-l border-[#2a2a3f] pl-4 md:pl-6">
                                <div class="text-[10px] uppercase tracking-[0.18em] text-gray-500 font-medium mb-3">JOGADORES</div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                                    ${jogadoresHtml}
                                </div>
                            </div>

                        </div>

                        <div class="mt-4 pt-3 border-t border-[#2a2a3f] text-center">
                            <span class="text-xs md:text-sm accent-purple font-semibold">Ver pastas de estilos →</span>
                        </div>
                    </div>
                `;
            });

            irParaTopo();
        }

        function abrirEquipe(idEquipe) {
            equipeSelecionada = dadosEquipes.find(e => e.id === idEquipe);

            if (!equipeSelecionada) return;

            nivelAtual = 'estilos';

            titulo.innerText = equipeSelecionada.nome;
            subtitulo.innerText = "Selecione a pasta desejada:";

            logoCabecalho.src = processarLinkDrive(equipeSelecionada.logo);
            logoCabecalho.classList.remove('hidden');

            btnVoltar.classList.add('hidden');

            if (scope === 'all') {
                btnInicio.classList.remove('hidden');
            } else {
                btnInicio.classList.add('hidden');
            }

            container.innerHTML = '';

            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Logotipos')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40">
                    <div class="text-4xl mb-3">📁</div>
                    <h2 class="font-bold text-amber-400 text-base">Logotipos</h2>
                    <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                </div>
            `;

            container.innerHTML += `
                <div onclick="abrirPastaLogosEBrasoes('Brasões')" class="bg-[#161624] border border-[#2a2a3f] p-6 rounded-xl shadow-md cursor-pointer card-hover transition flex flex-col items-center text-center border-amber-500/40">
                    <div class="text-4xl mb-3">📁</div>
                    <h2 class="font-bold text-amber-400 text-base">Brasões</h2>
                    <span class="text-xs accent-purple font-semibold mt-2">Abrir pasta</span>
                </div>
            `;

            listaEstilos.forEach((estilo, index) => {
                const info = obterInfoPastaPose(estilo);

                container.innerHTML += `
                    <div onclick="abrirEstilo(${index})" class="pose-folder-card p-5 md:p-6 rounded-xl shadow-md cursor-pointer transition">
                        <div class="relative z-10 flex flex-col h-full">
                            <div class="flex items-center justify-between gap-3 mb-5">
                                <span class="pose-folder-topline">MEDIA ASSET / ${escaparHtml(info.codigo)}</span>
                                <span class="pose-folder-code">${escaparHtml(info.codigo)}</span>
                            </div>

                            <div class="flex-1">
                                <h2 class="font-bold text-white text-lg md:text-xl leading-tight mb-2">${escaparHtml(info.titulo)}</h2>
                                ${info.direcao ? `<div class="pose-folder-direction mb-3">Direção: ${escaparHtml(info.direcao)}</div>` : ''}
                                <p class="text-xs md:text-sm text-gray-400 leading-relaxed max-w-[34rem]">${escaparHtml(info.descricao)}</p>
                            </div>

                            <div class="pose-folder-action">
                                <span class="pose-folder-meta">Coleção fotográfica</span>
                                <span class="pose-folder-open">Abrir pasta ↗</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            irParaTopo();
        }

        // Acesso de jogador: não exibe equipes, logos ou brasões.
        // Mostra somente as fotos do próprio jogador.
        function abrirEquipeJogador(equipe, membro) {
            equipeSelecionada = equipe;
            nivelAtual = 'player';

            const funcao = String(membro.funcao || '').trim().toUpperCase();
            const icone = iconesFuncoes[funcao] || '';
            const logoEquipe = processarLinkDrive(equipe.logo);
            const nomeJogador = String(membro.nick || 'Jogador').trim();

            titulo.innerText = nomeJogador;
            subtitulo.innerText = `${equipe.nome} · Área exclusiva do jogador`;

            logoCabecalho.src = logoEquipe;
            logoCabecalho.classList.remove('hidden');
            btnVoltar.classList.add('hidden');
            btnInicio.classList.add('hidden');

            const fotosDisponiveis = listaEstilos.filter(estilo => {
                const id = membro.fotos ? membro.fotos[estilo.sigla] : null;
                return id && String(id).trim() !== '';
            }).length;

            const infoFuncao = funcao && icone
                ? `<div class="flex items-center gap-2.5">
                        <img src="${icone}" alt="${escaparHtml(funcao)}" class="w-9 h-9 object-contain">
                        <div><div class="text-[9px] uppercase tracking-[.16em] text-gray-500">Função</div><div class="text-sm text-amber-400 font-bold">${escaparHtml(funcao)}</div></div>
                   </div>`
                : `<div><div class="text-[9px] uppercase tracking-[.16em] text-gray-500">Função</div><div class="text-sm text-gray-300 font-semibold">Não cadastrada</div></div>`;

            container.innerHTML = `
                <section class="player-hero col-span-full rounded-2xl p-5 md:p-7">
                    <div class="relative z-10 flex flex-col md:flex-row md:items-center gap-5">
                        <div class="player-avatar-ring shrink-0">
                            <img src="${logoEquipe}" alt="${escaparHtml(equipe.nome)}" class="max-w-[58px] max-h-[58px] object-contain" onerror="this.src='info-ffws/logoffws.png'">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-[9px] uppercase tracking-[.22em] text-gray-500 mb-1">PLAYER MEDIA PROFILE</div>
                            <h2 class="text-2xl md:text-3xl font-bold text-white truncate">${escaparHtml(nomeJogador)}</h2>
                            <div class="text-sm text-gray-400 mt-1">${escaparHtml(equipe.nome)} <span class="text-[#e8b033]">•</span> Acervo fotográfico individual</div>
                        </div>
                        <div class="shrink-0">${infoFuncao}</div>
                    </div>
                    <div class="relative z-10 grid grid-cols-2 md:grid-cols-3 gap-2.5 mt-6 pt-5 border-t border-[#2b2b3e]">
                        <div class="player-stat"><div class="player-stat-label">UID</div><div class="player-stat-value truncate">${escaparHtml(membro.uid || 'Não cadastrado')}</div></div>
                        <div class="player-stat"><div class="player-stat-label">Fotos disponíveis</div><div class="player-stat-value">${fotosDisponiveis} arquivos</div></div>
                        <div class="player-stat hidden md:block"><div class="player-stat-label">Equipe</div><div class="player-stat-value truncate">${escaparHtml(equipe.nome)}</div></div>
                    </div>
                </section>

                <div class="col-span-full flex items-end justify-between gap-4 mt-1 mb-1">
                    <div>
                        <div class="text-[9px] uppercase tracking-[.2em] text-gray-500">PHOTO LIBRARY</div>
                        <h2 class="text-xl md:text-2xl font-bold text-white mt-1">Fotos disponíveis</h2>
                    </div>
                    <div class="hidden sm:block text-xs text-gray-500">${fotosDisponiveis} ${fotosDisponiveis === 1 ? 'arquivo' : 'arquivos'}</div>
                </div>
            `;

            let htmlCards = '';
            let contador = 0;

            listaEstilos.forEach((estilo) => {
                const siglaEstilo = estilo.sigla;
                const fileId = membro.fotos ? membro.fotos[siglaEstilo] : null;
                if (!fileId || String(fileId).trim() === '') return;

                contador++;
                const urlDriveImg = processarLinkDrive(fileId);
                const nomeArquivo = nomeArquivoJogador(nomeJogador, siglaEstilo);
                const info = obterInfoPastaPose(estilo);
                const descricaoPose = info.direcao ? `${info.titulo} · Direção: ${info.direcao}` : info.titulo;

                htmlCards += `
                    <article class="player-photo-card rounded-2xl p-3.5 md:p-4 flex flex-col">
                        <div class="player-photo-stage">
                            <span class="player-photo-tag">${escaparHtml(info.codigo)} · MEDIA</span>
                            <span class="player-photo-index">${String(contador).padStart(2,'0')}</span>
                            <img src="${urlDriveImg}" alt="${escaparHtml(nomeJogador)} — ${escaparHtml(info.titulo)}" class="w-full h-full object-contain" onerror="this.src='info-ffws/logoffws.png'">
                        </div>
                        <div class="player-photo-caption flex-1">
                            <div class="player-photo-title">${escaparHtml(nomeJogador)}</div>
                            <div class="player-photo-sub">${escaparHtml(descricaoPose)}</div>
                        </div>
                        <button data-download-url="${encodeURIComponent(urlDriveImg)}" data-download-name="${encodeURIComponent(nomeArquivo)}" class="btn-download player-download btn-primary w-full">Baixar Foto <span class="ml-1">↓</span></button>
                    </article>
                `;
            });

            if (contador === 0) {
                container.innerHTML += `
                    <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-10 rounded-2xl text-center shadow-md">
                        <div class="text-4xl mb-4">◌</div>
                        <h2 class="text-xl font-bold text-white mb-2">Biblioteca ainda vazia</h2>
                        <p class="text-gray-400 text-sm">Nenhuma foto foi cadastrada para este jogador.</p>
                    </div>`;
            } else {
                container.innerHTML += `<div class="col-span-full grid grid-cols-1 md:grid-cols-2 gap-5">${htmlCards}</div>`;
            }

            irParaTopo();
        }

        function abrirPastaLogosEBrasoes(tipo) {
            nivelAtual = 'generica';

            titulo.innerText = `${equipeSelecionada.nome} - ${tipo}`;
            subtitulo.innerText = `Pasta: ${tipo}`;

            btnVoltar.classList.remove('hidden');
            btnVoltar.innerText = "← Voltar para a Pasta de Poses";

            if (scope === 'all') {
                btnInicio.classList.remove('hidden');
            }

            let itens = [];

            if (tipo === 'Logotipos') {
                itens = equipeSelecionada.logos || [];
            } else {
                itens = equipeSelecionada.brasoes || [];
            }

            const itensValidos = itens.filter(item => {
                const val = typeof item === 'string' ? item : (item.id || item.link);
                return val && val.trim() !== "" && !val.includes("SEU_ID");
            });

            if (itensValidos.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                        <div class="text-5xl mb-4">📂</div>
                        <h2 class="text-xl font-bold text-white mb-2">Nenhum ${tipo.slice(0, -1).toLowerCase()} cadastrado com ID do Drive</h2>
                        <p class="text-gray-300 text-sm mb-4">Insira os IDs do Google Drive no arquivo dados.js para esta equipe.</p>
                    </div>
                `;

                irParaTopo();
                return;
            }

            let htmlCards = '';

            itensValidos.forEach((item, idx) => {
                const valorBruto = typeof item === 'string' ? item : (item.id || item.link);
                const nomeItem = typeof item === 'object' && item.nome
                    ? item.nome
                    : `${tipo.slice(0, -1)} ${idx + 1}`;

                const urlDriveImg = processarLinkDrive(valorBruto);
                const nomeArquivo = nomeArquivoGenerico(nomeItem);

                htmlCards += `
                    <div class="bg-[#161624] border border-[#2a2a3f] p-4 rounded-xl shadow-md flex flex-col justify-between">
                        <div>
                            <div class="w-full h-48 bg-black/40 rounded mb-3 border border-[#2a2a3f] flex items-center justify-center overflow-hidden p-2">
                                <img src="${urlDriveImg}" alt="${escaparHtml(nomeItem)}" class="w-full h-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'">
                            </div>

                            <h2 class="font-bold text-white text-sm truncate mb-1" title="${escaparHtml(nomeItem)}">${escaparHtml(nomeItem)}</h2>
                            <p class="text-xs text-amber-400 font-medium mb-4">${tipo}</p>
                        </div>

                        <button
                            data-download-url="${encodeURIComponent(urlDriveImg)}"
                            data-download-name="${encodeURIComponent(nomeArquivo)}"
                            class="btn-download w-full btn-primary py-2 rounded transition text-sm font-semibold shadow-md text-center cursor-pointer block">
                            Baixar Arquivo
                        </button>
                    </div>
                `;
            });

            container.innerHTML = htmlCards;
            irParaTopo();
        }

        function abrirEstilo(indexEstilo) {
            estiloSelecionado = listaEstilos[indexEstilo];
            nivelAtual = 'fotos';

            const nomeFormatado = formatarTitulo(estiloSelecionado.nomeEstilo);

            titulo.innerText = `${equipeSelecionada.nome} - ${nomeFormatado}`;
            subtitulo.innerText = `Pasta: ${nomeFormatado}`;

            btnVoltar.classList.remove('hidden');
            btnVoltar.innerText = "← Voltar para a Pasta de Poses";

            if (scope === 'all') {
                btnInicio.classList.remove('hidden');
            } else {
                btnInicio.classList.add('hidden');
            }

            container.innerHTML = `
                <div class="col-span-full flex flex-col items-center justify-center p-16">
                    <div class="loader mb-4"></div>
                    <p class="text-gray-400">Buscando fotos disponíveis...</p>
                </div>
            `;

            if (!equipeSelecionada.membros || equipeSelecionada.membros.length === 0) {
                setTimeout(() => {
                    container.innerHTML = `<p class="text-gray-400 col-span-full text-center">Nenhum membro cadastrado para esta equipe.</p>`;
                }, 400);

                irParaTopo();
                return;
            }

            let htmlCards = '';
            let contadorEncontrados = 0;

            equipeSelecionada.membros.forEach((membro) => {
                const siglaEstilo = estiloSelecionado.sigla;
                const fileId = membro.fotos ? membro.fotos[siglaEstilo] : null;

                if (fileId && fileId.trim() !== "") {
                    contadorEncontrados++;

                    const urlDriveImg = processarLinkDrive(fileId);
                    const nomeArquivo = nomeArquivoJogador(membro.nick, siglaEstilo);
                    const funcao = String(membro.funcao || '').trim().toUpperCase();
                    const icone = iconesFuncoes[funcao] || '';

                    const funcaoHtml = funcao && icone
                        ? `<span class="flex items-center gap-1.5 text-xs text-amber-400 font-semibold">
                               <img src="${icone}" alt="${escaparHtml(funcao)}" class="w-5 h-5 object-contain">
                               <span>${escaparHtml(funcao)}</span>
                           </span>`
                        : '';

                    const uidHtml = membro.uid
                        ? `<span class="text-[11px] text-gray-400">UID: ${escaparHtml(membro.uid)}</span>`
                        : '';

                    htmlCards += `
                        <div class="bg-[#161624] border border-[#2a2a3f] p-4 rounded-xl shadow-md flex flex-col justify-between">
                            <div>
                                <div class="w-full h-48 bg-black/40 rounded mb-3 border border-[#2a2a3f] flex items-center justify-center overflow-hidden p-2">
                                    <img src="${urlDriveImg}" alt="${escaparHtml(membro.nick)}" class="w-full h-full object-contain filter drop-shadow" onerror="this.src='info-ffws/logoffws.png'">
                                </div>

                                <h2 class="font-bold text-white text-sm truncate mb-1" title="${escaparHtml(membro.nick)}">${escaparHtml(membro.nick)}</h2>

                                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                                    ${funcaoHtml}
                                    ${uidHtml}
                                </div>

                                <p class="text-xs text-amber-400 font-medium mb-4">${escaparHtml(nomeFormatado)} · ${siglaEstilo}</p>
                            </div>

                            <button
                                data-download-url="${encodeURIComponent(urlDriveImg)}"
                                data-download-name="${encodeURIComponent(nomeArquivo)}"
                                class="btn-download w-full btn-primary py-2 rounded transition text-sm font-semibold shadow-md text-center cursor-pointer block">
                                Baixar Foto
                            </button>
                        </div>
                    `;
                }
            });

            setTimeout(() => {
                if (contadorEncontrados === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-[#161624] border border-[#2a2a3f] p-8 rounded-xl text-center shadow-md">
                            <div class="text-5xl mb-4">📂</div>
                            <h2 class="text-xl font-bold text-white mb-2">Nenhuma foto cadastrada nesta pasta</h2>
                            <p class="text-gray-300 text-sm mb-4">Adicione os IDs do Google Drive correspondentes aos membros no arquivo de dados.</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = htmlCards;
                }
            }, 300);

            irParaTopo();
        }

        // Delegação de eventos para evitar problemas com acentos, aspas e caracteres especiais.
        document.addEventListener('click', function(event) {
            const botao = event.target.closest('.btn-download');

            if (!botao) return;

            const url = decodeURIComponent(botao.dataset.downloadUrl || '');
            const nome = decodeURIComponent(botao.dataset.downloadName || 'arquivo.png');

            baixarArquivo(url, nome);
        });

        window.onload = inicializarPainel;
    </script>
</body>
</html>
