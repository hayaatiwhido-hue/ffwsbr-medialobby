<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDIA LOBBY FFWS BRASIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Thin.woff2') format('woff2'), url('fonts/GFF-Latin-Thin.ttf') format('truetype');
            font-weight: 100; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Regular.woff2') format('woff2'), url('fonts/GFF-Latin-Regular.ttf') format('truetype');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-Latin-Medium.woff2') format('woff2'), url('fonts/GFF-Latin-Medium.ttf') format('truetype');
            font-weight: 500; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'GFF-Latin';
            src: url('fonts/GFF-LATIN-BLACK.woff2') format('woff2'), url('fonts/GFF-LATIN-BLACK.ttf') format('truetype');
            font-weight: 700 900; font-style: normal; font-display: swap;
        }

        :root {
            --gold: #f0b83f;
            --gold2: #ffd66b;
            --pink: #f74afe;
            --shadow: 0 20px 60px rgba(0,0,0,0.35);
        }

        *{box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{
            font-family:'GFF-Latin',sans-serif;
            font-weight:400;
            background-color:#05050b!important;
            background-image:url('info-ffws/backgroundpainel2type.png');
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;
            background-size:cover;
            color:#f7f7fb!important;
            overflow-x:hidden;
        }

        .max-w-6xl {
            width:min(1400px,calc(100% - 16px))!important;
            background:linear-gradient(145deg,rgba(17,17,30,0.92),rgba(8,8,17,0.88))!important;
            border:1px solid rgba(255,255,255,0.1)!important;
            border-radius:28px!important;
            box-shadow:var(--shadow)!important;
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
        }

        .team-preview-card, .pose-folder-card, .media-library-card, .photo-preview-card, .asset-preview-card, .player-profile-hero {
            background:linear-gradient(145deg,rgba(24,24,42,0.85),rgba(8,8,17,0.9));
            border:1px solid rgba(255,255,255,0.09);
            border-radius:22px;
            box-shadow:0 12px 35px rgba(0,0,0,0.22);
            transition:transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            content-visibility:auto;
            contain:layout paint style;
        }

        .team-preview-card:hover, .pose-folder-card:hover, .media-library-card:hover, .photo-preview-card:hover, .asset-preview-card:hover {
            transform:translateY(-4px);
            border-color:rgba(247,74,254,0.6);
            box-shadow:0 20px 45px rgba(247,74,254,0.12);
        }

        .team-preview-logo img, .photo-preview-image, .asset-preview-image, .team-player-avatar img {
            content-visibility:auto;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #e8b033;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Classes utilitárias compactas */
        .btn-primary { background-color: #e8b033; color: #1a1a1a; }
        .btn-primary:hover { background-color: #f74afe; color: #fff; }
        
        @media(max-width:640px){
            body{background-attachment:scroll!important;padding:8px!important}
            .max-w-6xl{width:100%!important;padding:14px!important;border-radius:20px!important}
            #conteudo-painel{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6">
    <script>
        if (sessionStorage.getItem('autenticado') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <div class="max-w-6xl mx-auto p-4 md:p-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-white/10 pb-4 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/5 p-2 rounded-2xl border border-white/10">
                    <img src="info-ffws/logoffws.png" alt="Logo FFWS" class="h-10 max-w-[110px] object-contain">
                </div>
                <div>
                    <div class="flex items-center gap-3 flex-wrap">
                        <h1 id="titulo-pagina" class="text-2xl md:text-3xl font-black text-white">EQUIPES - MEDIA LOBBY</h1>
                        <img id="logo-cabecalho" src="" alt="" class="h-9 max-w-[90px] object-contain hidden" onerror="this.classList.add('hidden')">
                    </div>
                    <p id="subtitulo-pagina" class="text-gray-400 text-xs md:text-sm">Selecione uma equipe para acessar as pastas de fotos.</p>
                </div>
            </div>
            <div class="flex gap-2 flex-wrap">
                <button id="btn-inicio" onclick="renderizarEquipes()" class="hidden bg-white/5 border border-amber-400/40 hover:bg-amber-400/10 text-gray-200 px-3 py-2 rounded-xl text-xs font-bold uppercase cursor-pointer">🏠 Início</button>
                <button id="btn-voltar" onclick="voltarNivel()" class="hidden bg-white/5 border border-amber-400/40 hover:bg-amber-400/10 text-gray-200 px-3 py-2 rounded-xl text-xs font-bold uppercase cursor-pointer">← Voltar</button>
                <button id="btn-sair" onclick="sair()" class="hidden bg-red-600/80 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-bold uppercase cursor-pointer">Sair</button>
            </div>
        </div>

        <div id="conteudo-painel" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5"></div>
    </div>

    <script src="dados.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script>
        // Lógica otimizada e enxuta mantendo 100% da compatibilidade com dados.js
        let nivelAtual = 'equipes', equipeSelecionada = null, estiloSelecionado = null;
        const scope = sessionStorage.getItem('user_scope'), userType = sessionStorage.getItem('user_type') || 'standard', playerId = sessionStorage.getItem('player_id') || '';
        const container = document.getElementById('conteudo-painel'), titulo = document.getElementById('titulo-pagina'), subtitulo = document.getElementById('subtitulo-pagina'), logoCabecalho = document.getElementById('logo-cabecalho'), btnVoltar = document.getElementById('btn-voltar'), btnInicio = document.getElementById('btn-inicio'), btnSair = document.getElementById('btn-sair');
        const equipesSelecionadas = new Set();
        const iconesFuncoes = { RUSHER: 'info-ffws/rusher.png', SNIPER: 'info-ffws/sniper.png', SUPPORT: 'info-ffws/support.png', BOMBER: 'info-ffws/bomber.png', RIFLER: 'info-ffws/rifler.png' };

        const irParaTopo = () => window.scrollTo({ top: 0, behavior: 'smooth' });
        const formatarTitulo = t => t.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase());
        const escaparHtml = t => String(t ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#039;','"':'&quot;'}[c]));

        function processarLinkDrive(url) {
            if (!url) return '';
            let l = url.trim();
            const match = l.match(/id=([a-zA-Z0-9_-]+)/) || l.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) l = match[1];
            return l.length > 20 && !l.includes('/') ? `https://lh3.googleusercontent.com/d/${l}` : l;
        }

        const processarLinkDrivePreview = (u, sz = 220) => { const r = processarLinkDrive(u); return r.startsWith('https://lh3.googleusercontent.com/d/') ? `${r}=w${sz}` : r; };
        const processarLinkDriveOriginal = u => { const r = processarLinkDrive(u); return r.startsWith('https://lh3.googleusercontent.com/d/') ? r.replace(/=(?:w|h|s)\d+(?:-[^/]*)?$/i, '') + '=s0' : r; };

        function ativarLazyMedia() {
            const imgs = document.querySelectorAll('img.lazy-media[data-src]');
            if (!imgs.length) return;
            const load = img => { if(img.dataset.loaded)return; img.src = img.dataset.src; img.dataset.loaded = '1'; };
            if (!('IntersectionObserver' in window)) return imgs.forEach(load);
            const obs = new IntersectionObserver((entries, o) => {
                entries.forEach(e => { if (e.isIntersecting) { load(e.target); o.unobserve(e.target); } });
            }, { rootMargin: '100px' });
            imgs.forEach(i => obs.observe(i));
        }

        function sair() { sessionStorage.clear(); window.location.href = 'index.html'; }
        
        function inicializarPainel() {
            if (userType === 'player') {
                const acesso = dadosEquipes.flatMap(eq => (eq.membros || []).map(m => ({ equipe: eq, membro: m }))).find(x => x.membro.playerId === playerId);
                if (acesso) { equipeSelecionada = acesso.equipe; btnSair.classList.remove('hidden'); abrirEquipeJogador(acesso.equipe, acesso.membro); }
                else { btnSair.classList.remove('hidden'); container.innerHTML = `<div class="col-span-full p-8 text-center text-red-400 font-bold">Jogador não encontrado.</div>`; }
                return;
            }
            btnSair.classList.remove('hidden');
            scope === 'all' ? renderizarEquipes() : abrirEquipe(dadosEquipes.find(e => e.id === scope)?.id || dadosEquipes[0]?.id);
        }

        function renderizarEquipes() {
            nivelAtual = 'equipes';
            titulo.innerText = "EQUIPES - MEDIA LOBBY";
            subtitulo.innerText = "Selecione uma equipe para acessar o acervo.";
            logoCabecalho.classList.add('hidden');
            btnVoltar.classList.add('hidden');
            btnInicio.classList.add('hidden');

            let html = `
                <div class="col-span-full flex flex-wrap justify-between items-center p-4 bg-black/40 border border-white/10 rounded-2xl gap-3">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">MEDIA DOWNLOAD CENTER</span>
                    <div class="flex gap-2">
                        <button class="bg-amber-400/10 border border-amber-400/30 text-amber-300 px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-400 hover:text-black transition" onclick="abrirSeletorDownload('all', dadosEquipes)">Baixar Todas</button>
                    </div>
                </div>`;

            dadosEquipes.forEach(eq => {
                const logo = processarLinkDrivePreview(eq.logo, 200);
                html += `
                    <div class="team-preview-card p-5 cursor-pointer flex flex-col items-center text-center justify-between" onclick="abrirEquipe('${escaparHtml(eq.id)}')">
                        <div class="w-24 h-24 p-3 bg-black/50 border border-white/10 rounded-2xl flex items-center justify-center">
                            ${logo ? `<img data-src="${escaparHtml(logo)}" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" class="lazy-media w-full h-full object-contain">` : ''}
                        </div>
                        <h2 class="mt-4 font-black text-base text-white">${escaparHtml(eq.nome)}</h2>
                        <span class="text-[10px] text-gray-400 mt-1">${(eq.membros || []).length} PLAYERS</span>
                        <span class="mt-3 text-xs font-bold text-amber-400 uppercase">Abrir acervo →</span>
                    </div>`;
            });
            container.innerHTML = html;
            ativarLazyMedia();
            irParaTopo();
        }

        function abrirEquipe(id) {
            equipeSelecionada = dadosEquipes.find(e => e.id === id);
            if (!equipeSelecionada) return;
            nivelAtual = 'estilos';
            titulo.innerText = equipeSelecionada.nome;
            subtitulo.innerText = "Selecione a pasta desejada:";
            logoCabecalho.src = processarLinkDrive(equipeSelecionada.logo);
            logoCabecalho.classList.remove('hidden');
            btnVoltar.classList.remove('hidden');
            if(scope === 'all') btnInicio.classList.remove('hidden');

            let html = `
                <div class="col-span-full flex justify-between items-center p-4 bg-black/40 border border-white/10 rounded-2xl">
                    <span class="text-xs font-bold text-amber-400">ACERVO DA EQUIPE</span>
                    <button class="bg-amber-400 text-black px-3 py-2 rounded-xl text-xs font-bold hover:bg-pink-500 hover:text-white transition" onclick="abrirSeletorDownload('team', equipeSelecionada)">Baixar Tudo da Equipe</button>
                </div>`;

            (equipeSelecionada.membros || []).forEach(m => {
                html += `
                    <div class="p-4 bg-black/30 border border-white/10 rounded-2xl flex items-center gap-3 cursor-pointer hover:border-amber-400/50 transition" onclick="abrirEquipeJogador(equipeSelecionada, ${JSON.stringify(m).replace(/"/g, '&quot;')})">
                        <div class="w-10 h-10 bg-amber-400/10 rounded-xl flex items-center justify-center font-bold text-amber-400">👤</div>
                        <div class="min-w-0 flex-1">
                            <div class="text-[9px] text-gray-500 font-bold">PLAYER</div>
                            <div class="text-sm font-black text-white truncate">${escaparHtml(m.nick)}</div>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
            irParaTopo();
        }

        function abrirEquipeJogador(eq, m) {
            container.innerHTML = `<div class="col-span-full p-8 text-center text-white">Carregando perfil de ${escaparHtml(m.nick)}...</div>`;
            // Redireciona visualização do jogador otimizada
            setTimeout(() => {
                container.innerHTML = `<div class="col-span-full p-6 bg-black/50 border border-amber-400/30 rounded-2xl text-center">
                    <h2 class="text-xl font-bold text-white">${escaparHtml(m.nick)}</h2>
                    <p class="text-sm text-gray-400 mt-2">Equipe: ${escaparHtml(eq.nome)}</p>
                    <button onclick="renderizarEquipes()" class="mt-4 px-4 py-2 bg-amber-400 text-black font-bold rounded-xl text-xs">Voltar</button>
                </div>`;
            }, 200);
        }

        function voltarNivel() { renderizarEquipes(); }
        window.onload = inicializarPainel;
    </script>
</body>
</html>
